<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Lobby Central - Among Tasks</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
    body {
      background: radial-gradient(circle at center, #0b1329 0%, #030712 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      margin: 0;
      padding: 1.2rem 0.8rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    .lobby-card {
      background: #111827;
      border: 3px solid #1f2937;
      border-radius: 20px;
      padding: 1.8rem 1.4rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    h1 {
      margin: 0;
      color: #38bdf8;
      font-size: 1.9rem;
      letter-spacing: 2px;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }
    p.subtitle {
      margin: 0;
      color: #94a3b8;
      font-size: 0.85rem;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      text-align: left;
    }
    label {
      font-size: 0.78rem;
      font-weight: 900;
      color: #cbd5e1;
      letter-spacing: 1px;
    }
    input {
      width: 100%;
      padding: 0.85rem;
      border-radius: 10px;
      border: 2px solid #334155;
      background: #0b0f19;
      color: #fff;
      font-size: 1.3rem;
      text-align: center;
      font-weight: bold;
    }
    input:focus {
      outline: none;
      border-color: #38bdf8;
    }

    .btn-main {
      padding: 1rem;
      background: linear-gradient(180deg, #10b981 0%, #059669 100%);
      color: #fff;
      border: 2px solid #34d399;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 4px 0 #047857;
      transition: all 0.1s;
    }
    .btn-main:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #047857;
    }

    #qrContainer {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      background: #080d1a;
      border: 2px dashed #334155;
      border-radius: 14px;
      padding: 1.2rem;
      margin-top: 0.5rem;
    }
    #qrcode {
      background: #fff;
      padding: 12px;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 6px 18px rgba(0,0,0,0.6);
    }
    #lobbyStats {
      font-size: 1rem;
      color: #34d399;
      font-weight: 900;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="lobby-card">
    <div>
      <h1>PANEL DE SALA</h1>
      <p class="subtitle">Configuración y Generación de Partida</p>
    </div>

    <div class="field-group">
      <label>NÚMERO TOTAL DE JUGADORES (Tripulación + 1 Impostor):</label>
      <input id="hostTotalPlayers" type="number" min="3" max="20" value="8" />
    </div>

    <button class="btn-main" onclick="createGameSession()">
      GENERAR SALA Y QR
    </button>

    <div id="qrContainer">
      <div style="font-size: 0.8rem; color: #94a3b8; font-weight: bold;">JUGADORES: ESCANEAD PARA ENTRAR</div>
      <div id="qrcode"></div>
      <div id="lobbyStats">Esperando jugadores...</div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://yxgwdxlplvxvnhnsgkja.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4Z3dkeGxwbHZ4dm5obnNna2phIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNDMzMDUsImV4cCI6MjEwNzkxOTMwNX0.qol-pxboTuyShUCVCjs5_qa0FJg5W-TONZjlSopuciQ';
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let statsInterval = null;

    async function createGameSession() {
      const total = parseInt(document.getElementById('hostTotalPlayers').value, 10);
      if (isNaN(total) || total < 3) return alert('Introduce un mínimo de 3 jugadores.');

      const ok = confirm(`¿Iniciar partida para ${total} jugadores (1 Impostor y ${total - 1} Tripulantes)? Se resetearán los roles anteriores.`);
      if (!ok) return;

      // 1. Limpiar jugadores anteriores y reuniones
      await client.from('game_players').delete().neq('id', 0);
      await client.from('game_meetings').upsert({ id: 'current', active: false, reported_by: null });

      // 2. Guardar el número de tripulantes exacto (total - 1)
      await client.from('game_settings').upsert({
        id: 'global',
        crew_count: total - 1,
        updated_at: new Date().toISOString()
      });

      // 3. Generar enlace exacto apuntando a join.html
      const currentOrigin = window.location.origin;
      const currentPath = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/'));
      const joinUrl = `${currentOrigin}${currentPath}/join.html`;

      const qrBox = document.getElementById('qrcode');
      qrBox.innerHTML = '';

      new QRCode(qrBox, {
        text: joinUrl,
        width: 190,
        height: 190,
        colorDark: '#000000',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });

      document.getElementById('qrContainer').style.display = 'flex';

      if (statsInterval) clearInterval(statsInterval);
      listenPlayersCount(total);
    }

    function listenPlayersCount(totalTarget) {
      async function updateCount() {
        const { data: players } = await client.from('game_players').select('player_name');
        const count = players ? players.length : 0;
        document.getElementById('lobbyStats').innerText = `Jugadores dentro: ${count} / ${totalTarget}`;
      }
      updateCount();
      statsInterval = setInterval(updateCount, 1500);
    }
  </script>
</body>
</html>
