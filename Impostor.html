<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Terminal del Impostor</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
    body {
      background: #090305;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      margin: 0;
      padding: 1rem 0.8rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { margin: 0 0 0.2rem 0; color: #ef4444; font-size: 1.5rem; letter-spacing: 2px; }
    p.subtitle { margin: 0 0 1rem 0; color: #94a3b8; font-size: 0.82rem; }

    .panel-container {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* Overlay inicio/bloqueo sesión única */
    #overlay {
      position: fixed; inset: 0; background: #090305; z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem;
    }
    .overlay-input {
      padding: 0.8rem; border-radius: 8px; border: 1px solid #444; background: #1e2430;
      color: #fff; width: 85%; max-width: 260px; text-align: center; font-size: 1rem; margin-bottom: 0.8rem;
    }
    .overlay-btn {
      margin-top: 0.5rem; padding: 0.8rem 1.8rem; background: #ef4444; color: #fff;
      border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem;
    }
    .btn-retry {
      margin-top: 1rem; padding: 0.6rem 1.2rem; background: #334155; color: #fff;
      border: none; border-radius: 6px; cursor: pointer; display: none;
    }
    .busy-box {
      background: rgba(239,68,68,0.15); border: 2px solid #ef4444; border-radius: 10px;
      padding: 1rem; margin: 1rem; max-width: 300px; display: none;
    }

    /* Tarjetas de sección */
    .card {
      background: #18090d;
      border: 2px solid #3f1118;
      border-radius: 12px;
      padding: 0.9rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      text-align: left;
    }
    .card-title {
      font-size: 0.85rem;
      font-weight: 900;
      color: #f87171;
      letter-spacing: 1px;
      margin-bottom: 0.6rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Barra de tareas global */
    .progress-track {
      width: 100%;
      height: 14px;
      background: #000;
      border-radius: 7px;
      border: 1px solid #4c0519;
      overflow: hidden;
      margin-top: 0.3rem;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #10b981, #22c55e);
      box-shadow: 0 0 10px #22c55e;
      transition: width 0.3s ease;
    }

    /* Desglose individual de tareas */
    .task-details-toggle {
      background: #2b0b12;
      border: 1px solid #450a0a;
      border-radius: 6px;
      color: #fca5a5;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 0.4rem 0.6rem;
      width: 100%;
      margin-top: 0.6rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .task-breakdown-list {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 0.6rem;
    }
    .task-breakdown-item {
      background: #0d0406;
      border: 1px solid #29080e;
      border-radius: 6px;
      padding: 0.4rem 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
    }
    .task-breakdown-count {
      font-weight: 900;
      color: #22c55e;
      font-family: monospace;
      font-size: 0.8rem;
    }

    /* Botones de sabotaje */
    .sabotage-btn {
      width: 100%;
      padding: 0.85rem;
      margin-bottom: 0.6rem;
      border-radius: 10px;
      border: 2px solid #ef4444;
      background: linear-gradient(180deg, #7f1d1d 0%, #450a0a 100%);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 900;
      letter-spacing: 1px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 0 #2b0606;
      transition: all 0.1s;
    }
    .sabotage-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #2b0606;
    }
    .sabotage-btn.active-now {
      border-color: #facc15;
      background: linear-gradient(180deg, #a16207 0%, #713f12 100%);
      box-shadow: 0 0 14px #facc15;
      animation: pulseAlert 1s infinite alternate;
    }
    .sabotage-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      border-color: #555;
      background: #222;
      box-shadow: none;
      transform: none;
    }
    @keyframes pulseAlert {
      from { box-shadow: 0 0 6px #facc15; }
      to { box-shadow: 0 0 18px #facc15; }
    }

    /* Radar de ocupación */
    .radar-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      font-size: 0.75rem;
    }
    .radar-item {
      background: #0f0407;
      border: 1px solid #2b0b12;
      border-radius: 6px;
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .radar-item.occupied {
      border-color: #ef4444;
      background: rgba(239, 68, 68, 0.1);
    }
    .radar-status {
      font-weight: bold;
    }
    .radar-status.free { color: #22c55e; }
    .radar-status.busy { color: #ef4444; }
  </style>
</head>
<body>

  <!-- Overlay para control de acceso y número de tripulantes -->
  <div id="overlay">
    <h2 id="ovTitle" style="color: #ef4444; margin-bottom: 0.3rem;">TERMINAL DEL IMPOSTOR</h2>
    <p id="ovDesc" style="color: #94a3b8; font-size: 0.85rem; margin-top: 0; margin-bottom: 1.2rem;">Identificación y configuración de la partida</p>
    
    <div id="busyAlert" class="busy-box">
      <div style="font-size: 2rem; margin-bottom: 0.3rem;">⏳</div>
      <strong style="color: #ef4444;">TERMINAL OCUPADA</strong>
      <p id="busyMsg" style="font-size: 0.85rem; color: #cbd5e1; margin: 0.4rem 0 0 0;"></p>
    </div>

    <input id="playerName" class="overlay-input" placeholder="Tu nombre..." autocomplete="off" />
    <input id="crewCountInput" class="overlay-input" type="number" min="1" max="20" placeholder="Nº de tripulantes (ej: 4)" autocomplete="off" />
    <button id="btnStart" class="overlay-btn" onclick="checkPlayer()">Acceder</button>
    <button id="btnRetry" class="btn-retry" onclick="resetForm()">Intentar de nuevo</button>
  </div>

  <div class="panel-container">
    <div>
      <h1>TERMINAL DE SABOTAJE</h1>
      <p class="subtitle">Canal encubierto de interferencia y sabotaje</p>
    </div>

    <!-- Progreso de Tareas Global con desglose individual X/Y -->
    <div class="card">
      <div class="card-title">
        <span>PROGRESO DE TRIPULACIÓN</span>
        <span id="progressText" style="color:#22c55e;">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressBar"></div>
      </div>
      <div id="tasksCount" style="font-size: 0.72rem; color: #94a3b8; margin-top: 0.4rem;">Cargando tareas...</div>

      <!-- Botón para ver/ocultar el detalle X/Y por tarea -->
      <button class="task-details-toggle" onclick="toggleTaskBreakdown()">
        <span>📊 Ver desglose por tarea</span>
        <span id="breakdownArrow">▼</span>
      </button>

      <!-- Lista de tareas X/Y -->
      <div class="task-breakdown-list" id="taskBreakdownGrid"></div>
    </div>

    <!-- Botones de Sabotaje con Cooldowns específicos -->
    <div class="card">
      <div class="card-title">
        <span>SISTEMA DE SABOTAJE</span>
        <span id="globalStatusLabel" style="color:#22c55e; font-size:0.75rem;">SISTEMAS OPERATIVOS</span>
      </div>

      <!-- Sabotaje 1: Luces (35s cooldown) -->
      <button id="btnLuces" class="sabotage-btn" onclick="triggerSabotage('luces')">
        <span>💡 APAGAR LUCES</span>
        <span id="badgeLuces" style="font-size:0.75rem;">LISTO</span>
      </button>

      <!-- Sabotaje 2: Fuga de Gas (60s cooldown - Crítico) -->
      <button id="btnFuga" class="sabotage-btn" onclick="triggerSabotage('fuga')">
        <span>☣️ FUGA DE GAS</span>
        <span id="badgeFuga" style="font-size:0.75rem;">LISTO</span>
      </button>

      <!-- Sabotaje 3: Invertir Controles (40s cooldown) -->
      <button id="btnControles" class="sabotage-btn" onclick="triggerSabotage('controles')">
        <span>🌀 INVERTIR CONTROLES</span>
        <span id="badgeControles" style="font-size:0.75rem;">LISTO</span>
      </button>
    </div>

    <!-- Radar en tiempo real -->
    <div class="card">
      <div class="card-title">
        <span>RADAR DE OCUPACIÓN</span>
        <span style="font-size:0.7rem; color:#94a3b8;">EN VIVO</span>
      </div>
      <div class="radar-list" id="radarGrid"></div>
    </div>
  </div>

  <script>
    const TASK_ID = 'impostor_terminal';
    const SUPABASE_URL = 'https://yxgwdxlplvxvnhnsgkja.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4Z3dkeGxwbHZ4dm5obnNna2phIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNDMzMDUsImV4cCI6MjEwNzkxOTMwNX0.qol-pxboTuyShUCVCjs5_qa0FJg5W-TONZjlSopuciQ';
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentPlayer = '';
    let totalCrewCount = 4; // Valor por defecto
    let heartbeatTimer = null;
    let showBreakdown = false;

    const COOLDOWNS = {
      luces: 35,
      fuga: 60,
      controles: 40
    };

    const lastFinishedTime = {
      luces: 0,
      fuga: 0,
      controles: 0
    };

    const ALL_TASKS = [
      { id: 'cables', name: '⚡ Cables' },
      { id: 'numeros', name: '🔢 Números' },
      { id: 'simon', name: '🧠 Simon' },
      { id: 'conduccion', name: '🚗 Conducción' },
      { id: 'dni', name: '🪪 DNI' },
      { id: 'operacion', name: '🧮 Operación' },
      { id: 'cascada', name: '🍻 Cascada' },
      { id: 'cucarachas', name: '🪳 Cucarachas' }
    ];

    let currentSabotages = {};

    function resetForm() {
      document.getElementById('ovTitle').innerText = 'TERMINAL DEL IMPOSTOR';
      document.getElementById('ovDesc').innerText = 'Identificación y configuración de la partida';
      document.getElementById('busyAlert').style.display = 'none';
      const inputName = document.getElementById('playerName');
      const inputCount = document.getElementById('crewCountInput');
      inputName.style.display = 'block';
      inputCount.style.display = 'block';
      inputName.value = '';
      inputCount.value = '';
      inputName.focus();
      document.getElementById('btnStart').style.display = 'block';
      document.getElementById('btnRetry').style.display = 'none';
    }

    async function checkPlayer() {
      const inputName = document.getElementById('playerName');
      const inputCount = document.getElementById('crewCountInput');

      const name = inputName.value.trim().toUpperCase();
      const count = parseInt(inputCount.value.trim(), 10);

      if (!name) return alert('Escribe tu nombre');
      if (isNaN(count) || count <= 0) return alert('Introduce un número de tripulantes válido (ej: 4)');

      currentPlayer = name;
      totalCrewCount = count;

      const { data: session } = await client
        .from('active_sessions')
        .select('*')
        .eq('task_name', TASK_ID)
        .maybeSingle();

      const now = Date.now();
      if (session) {
        const lastSeen = new Date(session.last_heartbeat).getTime();
        const secondsAgo = (now - lastSeen) / 1000;

        if (secondsAgo < 12 && session.player_name !== currentPlayer) {
          document.getElementById('ovTitle').innerText = 'ACCESO DENEGADO';
          document.getElementById('ovDesc').innerText = 'Ya hay un impostor conectado al terminal.';
          document.getElementById('busyAlert').style.display = 'block';
          document.getElementById('busyMsg').innerText = `${session.player_name} tiene la sesión abierta.`;
          inputName.style.display = 'none';
          inputCount.style.display = 'none';
          document.getElementById('btnStart').style.display = 'none';
          document.getElementById('btnRetry').style.display = 'block';
          return;
        }
      }

      await takeSession();
      document.getElementById('overlay').style.display = 'none';
      heartbeatTimer = setInterval(takeSession, 3000);

      pollData();
      setInterval(pollData, 2500);
      setInterval(updateCooldownUI, 1000);
    }

    async function takeSession() {
      await client.from('active_sessions').upsert({
        task_name: TASK_ID,
        player_name: currentPlayer,
        last_heartbeat: new Date().toISOString()
      });
    }

    async function releaseSession() {
      if (heartbeatTimer) clearInterval(heartbeatTimer);
      if (currentPlayer) {
        await client.from('active_sessions').delete().eq('task_name', TASK_ID).eq('player_name', currentPlayer);
      }
    }

    window.addEventListener('beforeunload', releaseSession);
    window.addEventListener('pagehide', releaseSession);

    function toggleTaskBreakdown() {
      showBreakdown = !showBreakdown;
      document.getElementById('taskBreakdownGrid').style.display = showBreakdown ? 'grid' : 'none';
      document.getElementById('breakdownArrow').innerText = showBreakdown ? '▲' : '▼';
    }

    async function pollData() {
      // 1. Sabotajes
      const { data: sabs } = await client.from('sabotages').select('*');
      if (sabs) {
        sabs.forEach(s => {
          const prev = currentSabotages[s.id];
          if (prev && prev.active && !s.active) {
            lastFinishedTime[s.id] = Date.now();
          }
          currentSabotages[s.id] = s;
        });
      }

      // 2. Progreso global y cálculo por tarea X/Y
      const { data: doneTasks } = await client.from('completed_tasks').select('*');
      if (doneTasks) {
        const totalMaxTasks = totalCrewCount * ALL_TASKS.length;
        const totalCompleted = doneTasks.length;

        const globalPercent = Math.min(100, Math.round((totalCompleted / totalMaxTasks) * 100));
        document.getElementById('progressBar').style.width = `${globalPercent}%`;
        document.getElementById('progressText').innerText = `${globalPercent}%`;
        document.getElementById('tasksCount').innerText = `${totalCompleted}/${totalMaxTasks} tareas completadas en total (${totalCrewCount} tripulantes)`;

        renderTaskBreakdown(doneTasks);
      }

      // 3. Radar
      const { data: sessions } = await client.from('active_sessions').select('*');
      renderRadar(sessions || []);
    }

    function renderTaskBreakdown(doneTasks) {
      const grid = document.getElementById('taskBreakdownGrid');
      grid.innerHTML = '';

      ALL_TASKS.forEach(t => {
        // Contar tripulantes distintos que completaron esta tarea concreta
        const completedThisTask = doneTasks.filter(item => item.task_name === t.id);
        const uniquePlayers = new Set(completedThisTask.map(i => i.player_name)).size;

        const el = document.createElement('div');
        el.className = 'task-breakdown-item';
        el.innerHTML = `
          <span>${t.name}</span>
          <span class="task-breakdown-count">${uniquePlayers}/${totalCrewCount}</span>
        `;
        grid.appendChild(el);
      });
    }

    function updateCooldownUI() {
      const now = Date.now();
      const anyActive = Object.values(currentSabotages).some(s => s && s.active);
      const globalLabel = document.getElementById('globalStatusLabel');

      if (anyActive) {
        globalLabel.innerText = '⚠️ SABOTAJE EN CURSO';
        globalLabel.style.color = '#facc15';
      } else {
        globalLabel.innerText = 'SISTEMAS OPERATIVOS';
        globalLabel.style.color = '#22c55e';
      }

      updateSingleButton('luces', 'btnLuces', 'badgeLuces', anyActive, now);
      updateSingleButton('fuga', 'btnFuga', 'badgeFuga', anyActive, now);
      updateSingleButton('controles', 'btnControles', 'badgeControles', anyActive, now);
    }

    function updateSingleButton(sabId, btnId, badgeId, anyActive, now) {
      const btn = document.getElementById(btnId);
      const badge = document.getElementById(badgeId);
      const info = currentSabotages[sabId];
      const maxCd = COOLDOWNS[sabId];
      const elapsed = Math.floor((now - lastFinishedTime[sabId]) / 1000);
      const remaining = maxCd - elapsed;

      if (info && info.active) {
        btn.classList.add('active-now');
        btn.disabled = false;
        badge.innerText = 'EN CURSO';
        return;
      }

      btn.classList.remove('active-now');

      if (anyActive) {
        btn.disabled = true;
        badge.innerText = 'BLOQUEADO';
        return;
      }

      if (lastFinishedTime[sabId] > 0 && remaining > 0) {
        btn.disabled = true;
        badge.innerText = `${remaining}s`;
        return;
      }

      btn.disabled = false;
      badge.innerText = 'LISTO';
    }

    async function triggerSabotage(sabId) {
      const info = currentSabotages[sabId];
      if (info && info.active) return;

      const labels = {
        luces: 'APAGAR LUCES',
        fuga: 'FUGA DE GAS (CRÍTICO)',
        controles: 'INVERTIR CONTROLES'
      };

      const ok = confirm(`¿Lanzar sabotaje: ${labels[sabId]}?`);
      if (!ok) return;

      await client.from('sabotages').upsert({
        id: sabId,
        active: true,
        started_at: new Date().toISOString(),
        fixed_by: null
      });

      if (navigator.vibrate) navigator.vibrate([100, 50, 200]);
      pollData();
    }

    function renderRadar(sessions) {
      const grid = document.getElementById('radarGrid');
      grid.innerHTML = '';
      const now = Date.now();

      ALL_TASKS.forEach(t => {
        const sess = sessions.find(s => s.task_name === t.id);
        let isOccupied = false;
        let occupant = '';

        if (sess) {
          const secondsAgo = (now - new Date(sess.last_heartbeat).getTime()) / 1000;
          if (secondsAgo < 12) {
            isOccupied = true;
            occupant = sess.player_name;
          }
        }

        const el = document.createElement('div');
        el.className = `radar-item ${isOccupied ? 'occupied' : ''}`;
        el.innerHTML = `
          <strong style="color:#f87171;">${t.name}</strong>
          <span class="radar-status ${isOccupied ? 'busy' : 'free'}">
            ${isOccupied ? `🔴 ${occupant}` : '🟢 Libre'}
          </span>
        `;
        grid.appendChild(el);
      });
    }
  </script>
</body>
</html>
