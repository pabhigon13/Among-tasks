<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Reactor: Simon Dice</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      background: #0b0d13;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      margin: 0;
      padding: 1rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    h2 { margin: 0 0 0.2rem 0; color: #a855f7; letter-spacing: 2px; font-size: 1.4rem; }
    p { margin: 0 0 0.8rem 0; color: #94a3b8; font-size: 0.85rem; }

    /* Indicador de 5 rondas */
    .round-indicators {
      display: flex;
      gap: 10px;
      margin-bottom: 1.2rem;
    }
    .round-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #1e293b;
      border: 2px solid #475569;
      transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .round-dot.active {
      background: #a855f7;
      border-color: #c084fc;
      box-shadow: 0 0 10px #a855f7;
    }

    /* Tablero 2x2 */
    .simon-board {
      background: #161922;
      border: 4px solid #334155;
      border-radius: 20px;
      padding: 1.2rem;
      display: grid;
      grid-template-columns: repeat(2, 110px);
      gap: 14px;
      box-shadow: inset 0 0 25px rgba(0,0,0,0.6), 0 10px 25px rgba(0,0,0,0.5);
    }

    .color-btn {
      width: 110px;
      height: 110px;
      border-radius: 16px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
      outline: none;
      opacity: 0.35;
      transition: opacity 0.12s ease, transform 0.08s ease, box-shadow 0.12s ease;
    }
    .color-btn:active {
      transform: scale(0.96);
    }

    /* Colores en reposo */
    .btn-green  { background: #22c55e; }
    .btn-red    { background: #ef4444; }
    .btn-yellow { background: #eab308; }
    .btn-blue   { background: #3b82f6; }

    /* Iluminación activa */
    .btn-green.lit  { opacity: 1; box-shadow: 0 0 25px #22c55e; border-color: #fff; }
    .btn-red.lit    { opacity: 1; box-shadow: 0 0 25px #ef4444; border-color: #fff; }
    .btn-yellow.lit { opacity: 1; box-shadow: 0 0 25px #eab308; border-color: #fff; }
    .btn-blue.lit   { opacity: 1; box-shadow: 0 0 25px #3b82f6; border-color: #fff; }

    .color-btn.error-flash {
      opacity: 1 !important;
      background: #ef4444 !important;
      box-shadow: 0 0 30px #ef4444 !important;
      border-color: #fff !important;
    }

    #turnLabel {
      margin-top: 1.2rem;
      font-weight: bold;
      font-size: 0.95rem;
      color: #c084fc;
      min-height: 1.4rem;
      letter-spacing: 1px;
    }

    #status {
      margin-top: 0.4rem;
      font-weight: bold;
      font-size: 1.2rem;
      color: #22c55e;
      min-height: 1.6rem;
    }

    /* Capa de inicio y bloqueo */
    #overlay {
      position: fixed; inset: 0; background: #0b0d13; z-index: 50;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem;
    }
    .overlay-input {
      padding: 0.8rem; border-radius: 8px; border: 1px solid #444; background: #1e2430;
      color: #fff; width: 80%; max-width: 250px; text-align: center; font-size: 1rem;
    }
    .overlay-btn {
      margin-top: 1rem; padding: 0.8rem 1.5rem; background: #a855f7; color: #fff;
      border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
    }
    .btn-retry {
      margin-top: 1rem; padding: 0.6rem 1.2rem; background: #334155; color: #fff;
      border: none; border-radius: 6px; cursor: pointer; display: none;
    }
    .busy-box {
      background: rgba(239,68,68,0.15); border: 2px solid #ef4444; border-radius: 10px;
      padding: 1rem; margin: 1rem; max-width: 300px; display: none;
    }
  </style>
</head>
<body>

  <!-- Overlay -->
  <div id="overlay">
    <h2 id="ovTitle" style="color: #a855f7;">IDENTIFÍCATE</h2>
    <p id="ovDesc">Escribe tu nombre para empezar la tarea</p>
    
    <div id="busyAlert" class="busy-box">
      <div style="font-size: 2rem; margin-bottom: 0.3rem;">⏳</div>
      <strong style="color: #ef4444;">TERMINAL OCUPADA</strong>
      <p id="busyMsg" style="font-size: 0.85rem; color: #cbd5e1; margin: 0.4rem 0 0 0;"></p>
    </div>

    <input id="playerName" class="overlay-input" placeholder="Tu nombre..." autocomplete="off" />
    <button id="btnStart" class="overlay-btn" onclick="checkPlayer()">Continuar</button>
    <button id="btnRetry" class="btn-retry" onclick="resetForm()">Intentar con otro nombre</button>
  </div>

  <h2>REACTOR: SIMON DICE</h2>
  <p>Memoriza la secuencia de colores y repítela</p>

  <!-- Luces de progreso -->
  <div class="round-indicators">
    <div class="round-dot" id="dot-0"></div>
    <div class="round-dot" id="dot-1"></div>
    <div class="round-dot" id="dot-2"></div>
    <div class="round-dot" id="dot-3"></div>
    <div class="round-dot" id="dot-4"></div>
  </div>

  <!-- Tablero 2x2 -->
  <div class="simon-board">
    <button class="color-btn btn-green" id="btn-0" onclick="handlePlayerTap(0)"></button>
    <button class="color-btn btn-red" id="btn-1" onclick="handlePlayerTap(1)"></button>
    <button class="color-btn btn-yellow" id="btn-2" onclick="handlePlayerTap(2)"></button>
    <button class="color-btn btn-blue" id="btn-3" onclick="handlePlayerTap(3)"></button>
  </div>

  <div id="turnLabel">Esperando...</div>
  <div id="status"></div>

  <script>
    const TASK_ID = 'simon';
    const SUPABASE_URL = 'https://yxgwdxlplvxvnhnsgkja.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4Z3dkeGxwbHZ4dm5obnNna2phIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNDMzMDUsImV4cCI6MjEwNzkxOTMwNX0.qol-pxboTuyShUCVCjs5_qa0FJg5W-TONZjlSopuciQ';
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentPlayer = '';
    let heartbeatTimer = null;

    const TOTAL_ROUNDS = 5;
    const FREQS = [330, 440, 550, 660]; // Tonos de los 4 botones
    let sequence = [];
    let currentRound = 0;
    let playerIndex = 0;
    let canPlay = false;

    // Sonido
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq = 440, type = 'sine', duration = 0.2) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function resetForm() {
      document.getElementById('ovTitle').innerText = 'IDENTIFÍCATE';
      document.getElementById('ovTitle').style.color = '#a855f7';
      document.getElementById('ovDesc').innerText = 'Escribe tu nombre para empezar la tarea';
      document.getElementById('busyAlert').style.display = 'none';
      const input = document.getElementById('playerName');
      input.style.display = 'block';
      input.value = '';
      input.focus();
      document.getElementById('btnStart').innerText = 'Continuar';
      document.getElementById('btnStart').style.display = 'block';
      document.getElementById('btnRetry').style.display = 'none';
    }

    async function checkPlayer() {
      const input = document.getElementById('playerName');
      const name = input.value.trim().toUpperCase();
      if (!name) return alert('Escribe tu nombre');

      currentPlayer = name;

      // 1. Ya completada
      const { data: doneData } = await client
        .from('completed_tasks')
        .select('*')
        .eq('player_name', currentPlayer)
        .eq('task_name', TASK_ID);

      if (doneData && doneData.length > 0) {
        document.getElementById('ovTitle').innerText = 'TAREA YA COMPLETADA';
        document.getElementById('ovTitle').style.color = '#ef4444';
        document.getElementById('ovDesc').innerText = `Hola ${currentPlayer}, ya completaste esta tarea. Espera a que el admin la reinicie.`;
        input.style.display = 'none';
        document.getElementById('btnStart').style.display = 'none';
        document.getElementById('btnRetry').style.display = 'block';
        return;
      }

      // 2. Comprobar ocupación
      const { data: session } = await client
        .from('active_sessions')
        .select('*')
        .eq('task_name', TASK_ID)
        .maybeSingle();

      const now = Date.now();
      if (session) {
        const lastSeen = new Date(session.last_heartbeat).getTime();
        const secondsAgo = (now - lastSeen) / 1000;

        if (secondsAgo < 12 && session.player_name !== currentPlayer) {
          document.getElementById('ovTitle').innerText = 'ACCESO DENEGADO';
          document.getElementById('ovTitle').style.color = '#ef4444';
          document.getElementById('ovDesc').innerText = 'Solo puede realizarla 1 tripulante a la vez.';
          document.getElementById('busyAlert').style.display = 'block';
          document.getElementById('busyMsg').innerText = `${session.player_name} está usando este panel ahora mismo.`;
          input.style.display = 'none';
          document.getElementById('btnStart').innerText = 'Comprobar si quedó libre';
          document.getElementById('btnStart').style.display = 'block';
          document.getElementById('btnRetry').style.display = 'block';
          return;
        }
      }

      // 3. Tomar posesión
      await takeSession();
      document.getElementById('overlay').style.display = 'none';
      heartbeatTimer = setInterval(takeSession, 3000);
      initNewGame();
    }

    async function takeSession() {
      await client.from('active_sessions').upsert({
        task_name: TASK_ID,
        player_name: currentPlayer,
        last_heartbeat: new Date().toISOString()
      });
    }

    async function releaseSession() {
      if (heartbeatTimer) clearInterval(heartbeatTimer);
      if (currentPlayer) {
        await client.from('active_sessions').delete().eq('task_name', TASK_ID).eq('player_name', currentPlayer);
      }
    }

    window.addEventListener('beforeunload', releaseSession);
    window.addEventListener('pagehide', releaseSession);

    // Lógica Simon
    function initNewGame() {
      sequence = [];
      for (let i = 0; i < TOTAL_ROUNDS; i++) {
        sequence.push(Math.floor(Math.random() * 4));
      }
      currentRound = 0;
      updateIndicators();
      setTimeout(playSequence, 800);
    }

    function updateIndicators() {
      for (let i = 0; i < TOTAL_ROUNDS; i++) {
        const dot = document.getElementById(`dot-${i}`);
        if (i < currentRound) dot.classList.add('active');
        else dot.classList.remove('active');
      }
    }

    async function playSequence() {
      canPlay = false;
      playerIndex = 0;
      const turn = document.getElementById('turnLabel');
      turn.innerText = "MEMORIZA LA SECUENCIA...";
      turn.style.color = "#c084fc";

      await sleep(400);

      const itemsToShow = sequence.slice(0, currentRound + 1);
      for (let colorIdx of itemsToShow) {
        await lightUpButton(colorIdx, 350);
        await sleep(200);
      }

      turn.innerText = `TU TURNO (RONDA ${currentRound + 1}/${TOTAL_ROUNDS})`;
      turn.style.color = "#38bdf8";
      canPlay = true;
    }

    function lightUpButton(index, duration = 300) {
      return new Promise(resolve => {
        const btn = document.getElementById(`btn-${index}`);
        btn.classList.add('lit');
        playBeep(FREQS[index], 'triangle', duration / 1000);
        setTimeout(() => {
          btn.classList.remove('lit');
          resolve();
        }, duration);
      });
    }

    async function handlePlayerTap(index) {
      if (!canPlay) return;

      lightUpButton(index, 200);

      if (index === sequence[playerIndex]) {
        playerIndex++;

        // Ronda superada
        if (playerIndex > currentRound) {
          canPlay = false;
          currentRound++;
          updateIndicators();

          if (currentRound >= TOTAL_ROUNDS) {
            // Completado al 100%
            document.getElementById('turnLabel').innerText = '';
            document.getElementById('status').innerText = '¡TAREA COMPLETADA!';
            playBeep(880, 'sine', 0.4);
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

            await client.from('completed_tasks').insert([{ player_name: currentPlayer, task_name: TASK_ID }]);
            await releaseSession();
          } else {
            // Siguiente ronda
            document.getElementById('turnLabel').innerText = '¡BIEN HECHO!';
            document.getElementById('turnLabel').style.color = '#22c55e';
            await sleep(800);
            playSequence();
          }
        }
      } else {
        // Fallo: volver a la Ronda 1
        canPlay = false;
        playBeep(160, 'sawtooth', 0.4);
        if (navigator.vibrate) navigator.vibrate(300);

        document.querySelectorAll('.color-btn').forEach(b => b.classList.add('error-flash'));
        const turn = document.getElementById('turnLabel');
        turn.innerText = "¡ERROR! VUELVES A LA RONDA 1";
        turn.style.color = "#ef4444";

        await sleep(800);
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('error-flash'));

        // Reinicio completo desde ronda 1
        initNewGame();
      }
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }
  </script>
</body>
</html>
