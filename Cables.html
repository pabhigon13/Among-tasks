<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Electricidad: Reparar Cableado</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; touch-action: none; -webkit-user-select: none; user-select: none; }
    body {
      background: #0f1117;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      margin: 0;
      padding: 1rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    h2 { margin: 0 0 0.3rem 0; color: #f59e0b; letter-spacing: 2px; }
    p { margin: 0 0 1rem 0; color: #94a3b8; font-size: 0.9rem; }
    .panel {
      position: relative;
      background: #1e2430;
      border: 4px solid #334155;
      border-radius: 14px;
      width: 100%;
      max-width: 360px;
      height: 380px;
      padding: 1.5rem 1rem;
      display: flex;
      justify-content: space-between;
      box-shadow: inset 0 0 25px rgba(0,0,0,0.6), 0 10px 25px rgba(0,0,0,0.5);
    }
    svg#wireCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
    .col { display: flex; flex-direction: column; justify-content: space-around; z-index: 10; }
    .slot {
      position: relative;
      width: 48px;
      height: 48px;
      border-radius: 8px;
      border: 3px solid #000;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: inset 0 -3px rgba(0,0,0,0.4);
    }
    .slot.selected { outline: 4px solid #fff; transform: scale(1.1); }
    .pin { width: 14px; height: 14px; border-radius: 50%; background: #cbd5e1; border: 2px solid #000; pointer-events: none; }
    .c-red { background: #ef4444; } .c-blue { background: #3b82f6; }
    .c-yellow { background: #eab308; } .c-green { background: #22c55e; }
    #status { margin-top: 1.2rem; font-weight: bold; font-size: 1.2rem; color: #22c55e; min-height: 1.6rem; }
    
    #overlay {
      position: fixed; inset: 0; background: #0f1117; z-index: 50;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem;
    }
    .overlay-input { padding: 0.8rem; border-radius: 8px; border: 1px solid #444; background: #1e2430; color: #fff; width: 80%; max-width: 250px; text-align: center; font-size: 1rem; }
    .overlay-btn { margin-top: 1rem; padding: 0.8rem 1.5rem; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .btn-retry { margin-top: 1rem; padding: 0.6rem 1.2rem; background: #334155; color: #fff; border: none; border-radius: 6px; cursor: pointer; display: none; }
    .busy-box { background: rgba(239,68,68,0.15); border: 2px solid #ef4444; border-radius: 10px; padding: 1rem; margin: 1rem; max-width: 300px; display: none; }
  </style>
</head>
<body>

  <div id="overlay">
    <h2 id="ovTitle">IDENTIFÍCATE</h2>
    <p id="ovDesc">Escribe tu nombre para empezar la tarea</p>
    
    <div id="busyAlert" class="busy-box">
      <div style="font-size: 2rem; margin-bottom: 0.3rem;">⏳</div>
      <strong style="color: #ef4444;">TERMINAL OCUPADA</strong>
      <p id="busyMsg" style="font-size: 0.85rem; color: #cbd5e1; margin: 0.4rem 0 0 0;"></p>
    </div>

    <input id="playerName" class="overlay-input" placeholder="Tu nombre..." autocomplete="off" />
    <button id="btnStart" class="overlay-btn" onclick="checkPlayer()">Continuar</button>
    <button id="btnRetry" class="btn-retry" onclick="resetForm()">Intentar con otro nombre</button>
  </div>

  <h2>ELECTRICIDAD</h2>
  <p>Arrastra o toca un cable y conéctalo a su color</p>

  <div class="panel" id="board">
    <svg id="wireCanvas"></svg>
    <div class="col" id="colLeft"></div>
    <div class="col" id="colRight"></div>
  </div>

  <div id="status"></div>

  <script>
    const TASK_ID = 'cables';
    const SUPABASE_URL = 'https://yxgwdxlplvxvnhnsgkja.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4Z3dkeGxwbHZ4dm5obnNna2phIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNDMzMDUsImV4cCI6MjEwNzkxOTMwNX0.qol-pxboTuyShUCVCjs5_qa0FJg5W-TONZjlSopuciQ';
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentPlayer = '';
    let heartbeatTimer = null;

    function resetForm() {
      document.getElementById('ovTitle').innerText = 'IDENTIFÍCATE';
      document.getElementById('ovTitle').style.color = '#f59e0b';
      document.getElementById('ovDesc').innerText = 'Escribe tu nombre para empezar la tarea';
      document.getElementById('busyAlert').style.display = 'none';
      const input = document.getElementById('playerName');
      input.style.display = 'block';
      input.value = '';
      input.focus();
      document.getElementById('btnStart').style.display = 'block';
      document.getElementById('btnRetry').style.display = 'none';
    }

    async function checkPlayer() {
      const input = document.getElementById('playerName');
      const name = input.value.trim().toUpperCase();
      if (!name) return alert('Escribe tu nombre');

      currentPlayer = name;

      // 1. Comprobar si ya la completó
      const { data: doneData } = await client
        .from('completed_tasks')
        .select('*')
        .eq('player_name', currentPlayer)
        .eq('task_name', TASK_ID);

      if (doneData && doneData.length > 0) {
        document.getElementById('ovTitle').innerText = 'TAREA YA COMPLETADA';
        document.getElementById('ovTitle').style.color = '#ef4444';
        document.getElementById('ovDesc').innerText = `Hola ${currentPlayer}, ya completaste esta tarea. Espera a que el admin la reinicie.`;
        input.style.display = 'none';
        document.getElementById('btnStart').style.display = 'none';
        document.getElementById('btnRetry').style.display = 'block';
        return;
      }

      // 2. Comprobar si el puesto está ocupado por otra persona (margen de 12 segundos)
      const { data: session } = await client
        .from('active_sessions')
        .select('*')
        .eq('task_name', TASK_ID)
        .maybeSingle();

      const now = Date.now();
      if (session) {
        const lastSeen = new Date(session.last_heartbeat).getTime();
        const secondsAgo = (now - lastSeen) / 1000;

        if (secondsAgo < 12 && session.player_name !== currentPlayer) {
          document.getElementById('ovTitle').innerText = 'ACCESO DENEGADO';
          document.getElementById('ovTitle').style.color = '#ef4444';
          document.getElementById('ovDesc').innerText = 'Solo puede realizarla 1 tripulante a la vez.';
          document.getElementById('busyAlert').style.display = 'block';
          document.getElementById('busyMsg').innerText = `${session.player_name} está usando este panel ahora mismo. Espera a que termine.`;
          input.style.display = 'none';
          document.getElementById('btnStart').innerText = 'Comprobar si quedó libre';
          document.getElementById('btnStart').style.display = 'block';
          document.getElementById('btnRetry').style.display = 'block';
          return;
        }
      }

      // 3. Tomar posesión del puesto
      await takeSession();
      document.getElementById('overlay').style.display = 'none';

      // Enviar pulso cada 3 segundos para mantener la reserva activa
      heartbeatTimer = setInterval(takeSession, 3000);
    }

    async function takeSession() {
      await client.from('active_sessions').upsert({
        task_name: TASK_ID,
        player_name: currentPlayer,
        last_heartbeat: new Date().toISOString()
      });
    }

    async function releaseSession() {
      if (heartbeatTimer) clearInterval(heartbeatTimer);
      if (currentPlayer) {
        await client.from('active_sessions').delete().eq('task_name', TASK_ID).eq('player_name', currentPlayer);
      }
    }

    // Liberar si cierra o cambia de app
    window.addEventListener('beforeunload', releaseSession);
    window.addEventListener('pagehide', releaseSession);

    // Minijuego
    const COLORS = [
      { id: 'red', hex: '#ef4444', class: 'c-red' },
      { id: 'blue', hex: '#3b82f6', class: 'c-blue' },
      { id: 'yellow', hex: '#eab308', class: 'c-yellow' },
      { id: 'green', hex: '#22c55e', class: 'c-green' }
    ];

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    const board = document.getElementById('board');
    const svg = document.getElementById('wireCanvas');
    const leftItems = shuffle(COLORS);
    const rightItems = shuffle(COLORS);
    let activeStart = null, liveWire = null, solvedCount = 0;

    leftItems.forEach(item => createSlot(item, 'left', document.getElementById('colLeft')));
    rightItems.forEach(item => createSlot(item, 'right', document.getElementById('colRight')));

    function createSlot(item, side, col) {
      const slot = document.createElement('div');
      slot.className = `slot ${item.class}`;
      slot.dataset.side = side;
      slot.dataset.color = item.id;
      slot.dataset.hex = item.hex;
      slot.innerHTML = '<div class="pin"></div>';
      col.appendChild(slot);
      bindEvents(slot);
    }

    function getCenter(el) {
      const b = board.getBoundingClientRect(), r = el.getBoundingClientRect();
      return { x: (r.left + r.width / 2) - b.left, y: (r.top + r.height / 2) - b.top };
    }

    function drawLine(p1, p2, hex, isTemp = false) {
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      const dx = (p2.x - p1.x) * 0.45;
      path.setAttribute('d', `M ${p1.x} ${p1.y} C ${p1.x + dx} ${p1.y}, ${p2.x - dx} ${p2.y}, ${p2.x} ${p2.y}`);
      path.setAttribute('stroke', hex);
      path.setAttribute('stroke-width', '10');
      path.setAttribute('stroke-linecap', 'round');
      path.setAttribute('fill', 'none');
      if (isTemp) path.id = 'temp-wire';
      svg.appendChild(path);
      return path;
    }

    function bindEvents(slot) {
      slot.addEventListener('pointerdown', (e) => {
        if (slot.dataset.done) return;
        if (slot.dataset.side !== 'left') {
          if (activeStart && activeStart.dataset.color === slot.dataset.color) connectSlots(activeStart, slot);
          else if (activeStart) cancelActive();
          return;
        }
        activeStart = slot;
        slot.classList.add('selected');
        const pos = getCenter(slot);
        liveWire = drawLine(pos, pos, slot.dataset.hex, true);
        slot.setPointerCapture(e.pointerId);
      });

      slot.addEventListener('pointermove', (e) => {
        if (!liveWire || !activeStart) return;
        const b = board.getBoundingClientRect();
        const start = getCenter(activeStart);
        const cur = { x: e.clientX - b.left, y: e.clientY - b.top };
        const dx = (cur.x - start.x) * 0.45;
        liveWire.setAttribute('d', `M ${start.x} ${start.y} C ${start.x + dx} ${start.y}, ${cur.x - dx} ${cur.y}, ${cur.x} ${cur.y}`);
      });

      slot.addEventListener('pointerup', (e) => {
        if (!activeStart) return;
        const elem = document.elementFromPoint(e.clientX, e.clientY)?.closest('.slot');
        if (elem && elem.dataset.side === 'right' && !elem.dataset.done && elem.dataset.color === activeStart.dataset.color) {
          connectSlots(activeStart, elem);
        } else if (liveWire) {
          liveWire.remove(); liveWire = null;
        }
      });
    }

    async function connectSlots(leftEl, rightEl) {
      if (liveWire) { liveWire.remove(); liveWire = null; }
      leftEl.classList.remove('selected');
      drawLine(getCenter(leftEl), getCenter(rightEl), leftEl.dataset.hex, false);
      leftEl.dataset.done = 'true'; rightEl.dataset.done = 'true';
      leftEl.style.pointerEvents = 'none'; rightEl.style.pointerEvents = 'none';
      activeStart = null;
      solvedCount++;

      if (solvedCount === COLORS.length) {
        document.getElementById('status').innerText = "¡TAREA COMPLETADA!";
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

        // Registrar terminada y soltar puesto
        await client.from('completed_tasks').insert([{ player_name: currentPlayer, task_name: TASK_ID }]);
        await releaseSession();
      }
    }

    function cancelActive() {
      if (liveWire) { liveWire.remove(); liveWire = null; }
      if (activeStart) { activeStart.classList.remove('selected'); activeStart = null; }
    }
  </script>
</body>
</html>
