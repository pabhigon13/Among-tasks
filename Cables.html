<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tarea: Conectar Cables</title>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body {
      background: #121216;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 1rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    h2 { margin-bottom: 0.5rem; color: #f59e0b; }
    p { margin-top: 0; color: #aaa; font-size: 0.9rem; }
    .panel {
      background: #23272e;
      border: 3px solid #3e4451;
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 320px;
    }
    .col { display: flex; flex-direction: column; gap: 1.2rem; }
    .btn {
      width: 50px;
      height: 50px;
      border-radius: 8px;
      border: 3px solid #fff;
      cursor: pointer;
      outline: none;
      transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.92); }
    .rojo { background: #ef4444; }
    .azul { background: #3b82f6; }
    .amarillo { background: #eab308; }
    .verde { background: #22c55e; }
    .selected { outline: 4px solid #fff; transform: scale(1.1); }
    .done { opacity: 0.2; pointer-events: none; border-color: transparent; }
    #msg {
      margin-top: 1.5rem;
      font-weight: bold;
      font-size: 1.3rem;
      color: #22c55e;
      min-height: 2rem;
    }
  </style>
</head>
<body>

  <h2>ELECTRICIDAD</h2>
  <p>Toca un color de la izquierda y luego su pareja a la derecha</p>

  <div class="panel">
    <!-- Lado Izquierdo -->
    <div class="col">
      <button class="btn rojo" onclick="pick('rojo', this)"></button>
      <button class="btn azul" onclick="pick('azul', this)"></button>
      <button class="btn amarillo" onclick="pick('amarillo', this)"></button>
      <button class="btn verde" onclick="pick('verde', this)"></button>
    </div>

    <!-- Lado Derecho (desordenado) -->
    <div class="col">
      <button class="btn azul" onclick="match('azul', this)"></button>
      <button class="btn rojo" onclick="match('rojo', this)"></button>
      <button class="btn verde" onclick="match('verde', this)"></button>
      <button class="btn amarillo" onclick="match('amarillo', this)"></button>
    </div>
  </div>

  <div id="msg"></div>

  <script>
    let current = null;
    let currentElem = null;
    let completed = 0;

    function pick(color, el) {
      if (currentElem) currentElem.classList.remove('selected');
      current = color;
      currentElem = el;
      el.classList.add('selected');
    }

    function match(color, el) {
      if (!current) return;
      if (current === color) {
        currentElem.classList.remove('selected');
        currentElem.classList.add('done');
        el.classList.add('done');
        current = null;
        currentElem = null;
        completed++;
        
        if (completed === 4) {
          document.getElementById('msg').innerText = '¡TAREA COMPLETADA!';
          if (navigator.vibrate) navigator.vibrate(200);
        }
      } else {
        currentElem.classList.remove('selected');
        current = null;
        currentElem = null;
      }
    }
  </script>
</body>
</html>
