<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tarea: Conectar Cables</title>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body {
      background: #121216;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 1rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    h2 { margin-bottom: 0.5rem; color: #f59e0b; }
    p { margin-top: 0; color: #aaa; font-size: 0.9rem; }
    .panel {
      background: #23272e;
      border: 3px solid #3e4451;
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 320px;
    }
    .col { display: flex; flex-direction: column; gap: 1.2rem; }
    .btn {
      width: 50px;
      height: 50px;
      border-radius: 8px;
      border: 3px solid #fff;
      cursor: pointer;
      outline: none;
      transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.92); }
    .rojo { background: #ef4444; }
    .azul { background: #3b82f6; }
    .amarillo { background: #eab308; }
    .verde { background: #22c55e; }
    .selected { outline: 4px solid #fff; transform: scale(1.1); }
    .done { opacity: 0.2; pointer-events: none; border-color: transparent; }
    #msg {
      margin-top: 1.5rem;
      font-weight: bold;
      font-size: 1.3rem;
      color: #22c55e;
      min-height: 2rem;
    }
  </style>
</head>
<body>

  <h2>ELECTRICIDAD</h2>
  <p>Toca un color de la izquierda y luego su pareja a la derecha</p>

  <div class="panel">
    <!-- Columna izquierda generada dinámicamente -->
    <div class="col" id="col-left"></div>

    <!-- Columna derecha generada dinámicamente -->
    <div class="col" id="col-right"></div>
  </div>

  <div id="msg"></div>

  <script>
    const COLORS = ['rojo', 'azul', 'amarillo', 'verde'];

    // Algoritmo para barajar arrays aleatoriamente
    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    const colLeft = document.getElementById('col-left');
    const colRight = document.getElementById('col-right');

    const leftColors = shuffle(COLORS);
    const rightColors = shuffle(COLORS);

    let current = null;
    let currentElem = null;
    let completed = 0;

    // Renderizar botones izquierdos
    leftColors.forEach(color => {
      const btn = document.createElement('button');
      btn.className = `btn ${color}`;
      btn.onclick = () => pick(color, btn);
      colLeft.appendChild(btn);
    });

    // Renderizar botones derechos
    rightColors.forEach(color => {
      const btn = document.createElement('button');
      btn.className = `btn ${color}`;
      btn.onclick = () => match(color, btn);
      colRight.appendChild(btn);
    });

    function pick(color, el) {
      if (currentElem) currentElem.classList.remove('selected');
      current = color;
      currentElem = el;
      el.classList.add('selected');
    }

    function match(color, el) {
      if (!current) return;
      if (current === color) {
        currentElem.classList.remove('selected');
        currentElem.classList.add('done');
        el.classList.add('done');
        current = null;
        currentElem = null;
        completed++;
        
        if (completed === COLORS.length) {
          document.getElementById('msg').innerText = '¡TAREA COMPLETADA!';
          if (navigator.vibrate) navigator.vibrate(200);
        }
      } else {
        currentElem.classList.remove('selected');
        current = null;
        currentElem = null;
      }
    }
  </script>
</body>
</html>
