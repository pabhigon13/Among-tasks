<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Reparación: Comunicaciones</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
    body {
      background: #060b11;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      margin: 0;
      padding: 1rem 0.8rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    h2 { margin: 0 0 0.2rem 0; color: #38bdf8; font-size: 1.4rem; letter-spacing: 2px; }
    p { margin: 0 0 1rem 0; color: #94a3b8; font-size: 0.85rem; }

    .comms-cabinet {
      background: #0f172a;
      border: 4px solid #1e293b;
      border-radius: 18px;
      width: 100%;
      max-width: 360px;
      padding: 1.2rem 1rem;
      box-shadow: inset 0 0 25px rgba(0,0,0,0.8), 0 12px 30px rgba(0,0,0,0.7);
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .screen-status {
      background: #020617;
      border: 2px solid #334155;
      border-radius: 10px;
      padding: 0.8rem;
      font-family: "Courier New", monospace;
      font-weight: 900;
      letter-spacing: 1px;
      font-size: 0.95rem;
    }
    .screen-status.danger {
      color: #ef4444;
      border-color: #ef4444;
      background: rgba(239, 68, 68, 0.1);
      animation: commsBlink 1s infinite alternate;
    }
    .screen-status.ok {
      color: #22c55e;
      border-color: #22c55e;
      background: rgba(34, 197, 94, 0.1);
    }
    @keyframes commsBlink {
      from { box-shadow: 0 0 4px #ef4444; }
      to { box-shadow: 0 0 16px #ef4444; }
    }

    /* Visualizador de ondas / sintonizador */
    .tuner-display {
      background: #020617;
      border: 2px solid #1e293b;
      border-radius: 12px;
      height: 120px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .grid-lines {
      position: absolute; inset: 0;
      background-image: 
        linear-gradient(rgba(56, 189, 248, 0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.1) 1px, transparent 1px);
      background-size: 20px 20px;
      pointer-events: none;
    }
    .signal-target {
      position: absolute;
      width: 44px;
      height: 100%;
      background: rgba(34, 197, 94, 0.15);
      border-left: 2px dashed #22c55e;
      border-right: 2px dashed #22c55e;
      pointer-events: none;
    }
    .signal-cursor {
      position: absolute;
      width: 4px;
      height: 100%;
      background: #38bdf8;
      box-shadow: 0 0 10px #38bdf8;
      transition: left 0.05s ease-out;
    }

    .tuner-controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #0b1120;
      border: 2px solid #1e293b;
      border-radius: 10px;
      padding: 1rem;
    }
    .slider-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      font-weight: bold;
      color: #94a3b8;
      font-family: monospace;
    }
    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      height: 10px;
      background: #1e293b;
      border-radius: 5px;
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #38bdf8;
      cursor: pointer;
      box-shadow: 0 0 10px #38bdf8;
    }

    /* Calibración mantenida */
    .hold-bar-container {
      width: 100%;
      height: 10px;
      background: #020617;
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid #1e293b;
    }
    .hold-bar-fill {
      width: 0%;
      height: 100%;
      background: #22c55e;
      transition: width 0.1s linear;
    }

    #overlay {
      position: fixed; inset: 0; background: #060b11; z-index: 50;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem;
    }
    .overlay-input {
      padding: 0.8rem; border-radius: 8px; border: 1px solid #444; background: #1e2430;
      color: #fff; width: 80%; max-width: 250px; text-align: center; font-size: 1rem;
    }
    .overlay-btn {
      margin-top: 1rem; padding: 0.8rem 1.5rem; background: #0284c7; color: #fff;
      border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Overlay -->
  <div id="overlay">
    <h2 style="color: #38bdf8;">TERMINAL DE COMUNICACIONES</h2>
    <p>Escribe tu nombre para calibrar la antena</p>
    <input id="playerName" class="overlay-input" placeholder="Tu nombre..." autocomplete="off" />
    <button class="overlay-btn" onclick="startTerminal()">Entrar a la Consola</button>
  </div>

  <h2>ANTENA DE COMUNICACIONES</h2>
  <p>Sintoniza la frecuencia para restaurar la interfaz</p>

  <div class="comms-cabinet">
    <div id="screenStatus" class="screen-status danger">
      COMPROBANDO ENLACE...
    </div>

    <!-- Visualizador de señal -->
    <div class="tuner-display">
      <div class="grid-lines"></div>
      <div id="targetBand" class="signal-target" style="left: 65%;"></div>
      <div id="signalCursor" class="signal-cursor" style="left: 50%;"></div>
    </div>

    <!-- Barra de sincronización sostenida -->
    <div>
      <div style="font-size: 0.72rem; color: #94a3b8; margin-bottom: 4px; text-align: left;">CALIBRANDO SEÑAL:</div>
      <div class="hold-bar-container">
        <div id="holdProgress" class="hold-bar-fill"></div>
      </div>
    </div>

    <!-- Deslizador de Frecuencia -->
    <div class="tuner-controls">
      <div class="slider-label">
        <span>FRECUENCIA (MHz)</span>
        <span id="freqDisplay" style="color: #38bdf8;">104.2 MHz</span>
      </div>
      <input type="range" id="freqSlider" min="0" max="100" value="15" oninput="onSliderMove()" />
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://yxgwdxlplvxvnhnsgkja.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4Z3dkeGxwbHZ4dm5obnNna2phIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNDMzMDUsImV4cCI6MjEwNzkxOTMwNX0.qol-pxboTuyShUCVCjs5_qa0FJg5W-TONZjlSopuciQ';
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentPlayer = '';
    let isSabotageActive = false;
    let targetPos = 70; // Porcentaje donde se alinea la señal
    let holdCount = 0;
    let holdInterval = null;
    let isFixed = false;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq = 440, type = 'sine', duration = 0.08) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function startTerminal() {
      const input = document.getElementById('playerName');
      const name = input.value.trim().toUpperCase();
      if (!name) return alert('Escribe tu nombre');
      currentPlayer = name;
      document.getElementById('overlay').style.display = 'none';

      checkSabotage();
      setInterval(checkSabotage, 2000);
      holdInterval = setInterval(checkHold, 100);
    }

    async function checkSabotage() {
      const { data: sab } = await client.from('sabotages').select('*').eq('id', 'controles').maybeSingle();
      const screen = document.getElementById('screenStatus');

      if (!sab || !sab.active) {
        isSabotageActive = false;
        isFixed = false;
        screen.className = 'screen-status ok';
        screen.innerText = 'COMUNICACIONES EN LÍNEA';
        document.getElementById('holdProgress').style.width = '100%';
        return;
      }

      if (!isSabotageActive) {
        // Nuevo sabotaje detectado
        isSabotageActive = true;
        isFixed = false;
        holdCount = 0;
        screen.className = 'screen-status danger';
        screen.innerText = '⚠️ INTERFERENCIA DE SEÑAL ⚠️';
        // Generar una banda objetivo aleatoria
        targetPos = Math.floor(Math.random() * 60) + 20; // entre 20% y 80%
        document.getElementById('targetBand').style.left = `${targetPos}%`;
      }
    }

    function onSliderMove() {
      if (!isSabotageActive || isFixed) return;
      const val = parseInt(document.getElementById('freqSlider').value, 10);
      document.getElementById('signalCursor').style.left = `${val}%`;
      const mhz = (88 + (val * 0.4)).toFixed(1);
      document.getElementById('freqDisplay').innerText = `${mhz} MHz`;
    }

    async function checkHold() {
      if (!isSabotageActive || isFixed) return;

      const val = parseInt(document.getElementById('freqSlider').value, 10);
      // Comprobar si el cursor está dentro de la banda objetivo (±5%)
      const inRange = Math.abs(val - targetPos) <= 6;

      if (inRange) {
        holdCount += 5; // Suma progreso
        playBeep(400 + holdCount * 4, 'sine', 0.05);
      } else {
        holdCount = Math.max(0, holdCount - 8); // Se descarga si sales
      }

      const pct = Math.min(100, holdCount);
      document.getElementById('holdProgress').style.width = `${pct}%`;

      if (pct >= 100) {
        isFixed = true;
        playBeep(880, 'sine', 0.4);
        if (navigator.vibrate) navigator.vibrate([100, 50, 150]);

        const screen = document.getElementById('screenStatus');
        screen.className = 'screen-status ok';
        screen.innerText = '¡SEÑAL Y CONTROLES RESTAURADOS!';

        await client.from('sabotages').upsert({
          id: 'controles',
          active: false,
          fixed_by: currentPlayer
        });
      }
    }
  </script>
</body>
</html>
