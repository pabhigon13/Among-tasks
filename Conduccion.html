<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Transporte: Conducción en Ruta</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      background: #0b0d10;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0.8rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }
    h2 { margin: 0 0 0.2rem 0; color: #fb923c; letter-spacing: 2px; font-size: 1.3rem; }
    p { margin: 0 0 0.8rem 0; color: #94a3b8; font-size: 0.85rem; }

    /* Marco panorámico horizontal */
    .gps-frame {
      position: relative;
      background: radial-gradient(circle at center, #1c1917 0%, #0c0a09 80%, #000 100%);
      border: 4px solid #ea580c;
      border-radius: 16px;
      width: 100%;
      max-width: 680px;
      height: 280px;
      overflow: hidden;
      box-shadow: inset 0 0 35px rgba(0,0,0,0.8), 0 0 20px rgba(234, 88, 12, 0.25);
    }

    .gps-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(251, 146, 60, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(251, 146, 60, 0.08) 1px, transparent 1px);
      background-size: 26px 26px;
      pointer-events: none;
    }

    .route-badge {
      position: absolute;
      top: 10px;
      left: 12px;
      background: #ea580c;
      color: #fff;
      font-weight: 900;
      font-size: 0.65rem;
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: 1px;
      z-index: 4;
    }
    .compass {
      position: absolute;
      top: 10px;
      right: 12px;
      font-size: 0.75rem;
      color: #78716c;
      font-weight: bold;
      z-index: 4;
    }

    svg#mapSvg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    .waypoint-node {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 3;
      pointer-events: none;
    }
    .waypoint-dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #292524;
      border: 2px dashed #fb923c;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.8rem;
      color: #fdba74;
      transition: all 0.2s ease;
    }
    .waypoint-node.reached .waypoint-dot {
      background: #ea580c;
      border-style: solid;
      color: #fff;
      box-shadow: 0 0 14px #fb923c;
    }
    .waypoint-node.target .waypoint-dot {
      border-color: #facc15;
      color: #fef08a;
      animation: pulseTarget 1s infinite alternate;
    }
    .waypoint-label {
      margin-top: 3px;
      font-size: 0.65rem;
      font-weight: bold;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: rgba(12, 10, 9, 0.85);
      border: 1px solid rgba(251, 146, 60, 0.3);
      padding: 1px 5px;
      border-radius: 3px;
      white-space: nowrap;
    }

    @keyframes pulseTarget {
      from { transform: scale(1); box-shadow: 0 0 4px #facc15; }
      to { transform: scale(1.18); box-shadow: 0 0 14px #facc15; }
    }

    /* Coche */
    #car {
      position: absolute;
      width: 44px;
      height: 44px;
      transform: translate(-50%, -50%);
      z-index: 10;
      cursor: grab;
      filter: drop-shadow(0 0 8px rgba(251, 146, 60, 0.85));
    }
    #car:active {
      cursor: grabbing;
      filter: drop-shadow(0 0 14px rgba(251, 146, 60, 1));
    }

    #status {
      margin-top: 1rem;
      font-weight: bold;
      font-size: 1.2rem;
      color: #22c55e;
      min-height: 1.6rem;
      letter-spacing: 1px;
    }

    /* Capa de inicio y bloqueo */
    #overlay {
      position: fixed; inset: 0; background: #0b0d10; z-index: 50;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem;
    }
    .overlay-input {
      padding: 0.8rem; border-radius: 8px; border: 1px solid #444; background: #1e2430;
      color: #fff; width: 80%; max-width: 250px; text-align: center; font-size: 1rem;
    }
    .overlay-btn {
      margin-top: 1rem; padding: 0.8rem 1.5rem; background: #ea580c; color: #fff;
      border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
    }
    .btn-retry {
      margin-top: 1rem; padding: 0.6rem 1.2rem; background: #334155; color: #fff;
      border: none; border-radius: 6px; cursor: pointer; display: none;
    }
    .busy-box {
      background: rgba(239,68,68,0.15); border: 2px solid #ef4444; border-radius: 10px;
      padding: 1rem; margin: 1rem; max-width: 300px; display: none;
    }
  </style>
</head>
<body>

  <div id="overlay">
    <h2 id="ovTitle" style="color: #fb923c;">IDENTIFÍCATE</h2>
    <p id="ovDesc">Escribe tu nombre para empezar la tarea</p>
    
    <div id="busyAlert" class="busy-box">
      <div style="font-size: 2rem; margin-bottom: 0.3rem;">⏳</div>
      <strong style="color: #ef4444;">TERMINAL OCUPADA</strong>
      <p id="busyMsg" style="font-size: 0.85rem; color: #cbd5e1; margin: 0.4rem 0 0 0;"></p>
    </div>

    <input id="playerName" class="overlay-input" placeholder="Tu nombre..." autocomplete="off" />
    <button id="btnStart" class="overlay-btn" onclick="checkPlayer()">Continuar</button>
    <button id="btnRetry" class="btn-retry" onclick="resetForm()">Intentar con otro nombre</button>
  </div>

  <h2>CONDUCCIÓN</h2>
  <p>Arrastra el coche por la carretera: Valencia ➔ Buñol ➔ Utiel ➔ Minglanilla</p>

  <div class="gps-frame" id="gps">
    <div class="route-badge">AUTOVÍA A-3</div>
    <div class="compass">E ▶</div>
    <div class="gps-grid"></div>
    <svg id="mapSvg"></svg>

    <div id="waypointsContainer"></div>

    <!-- Coche horizontal -->
    <div id="car">
      <svg viewBox="0 0 100 100" width="100%" height="100%">
        <rect x="16" y="24" width="68" height="52" rx="14" fill="#fb923c" stroke="#c2410c" stroke-width="4"/>
        <rect x="24" y="16" width="16" height="8" rx="3" fill="#1c1917"/>
        <rect x="60" y="16" width="16" height="8" rx="3" fill="#1c1917"/>
        <rect x="24" y="76" width="16" height="8" rx="3" fill="#1c1917"/>
        <rect x="60" y="76" width="16" height="8" rx="3" fill="#1c1917"/>
        <path d="M 64 32 L 64 68 L 74 64 L 74 36 Z" fill="#0284c7"/>
        <rect x="38" y="33" width="24" height="34" rx="4" fill="#ea580c"/>
        <path d="M 36 34 L 36 66 L 30 63 L 30 37 Z" fill="#0284c7"/>
        <ellipse cx="81" cy="32" rx="2" ry="4" fill="#fef08a"/>
        <ellipse cx="81" cy="68" rx="2" ry="4" fill="#fef08a"/>
      </svg>
    </div>
  </div>

  <div id="status"></div>

  <script>
    const TASK_ID = 'conduccion';
    const SUPABASE_URL = 'https://yxgwdxlplvxvnhnsgkja.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4Z3dkeGxwbHZ4dm5obnNna2phIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNDMzMDUsImV4cCI6MjEwNzkxOTMwNX0.qol-pxboTuyShUCVCjs5_qa0FJg5W-TONZjlSopuciQ';
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentPlayer = '';
    let heartbeatTimer = null;

    let WAYPOINTS = [];
    let currentStep = 1;
    let isDragging = false;
    let isCompleted = false;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq = 440, type = 'sine', duration = 0.15) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function resetForm() {
      document.getElementById('ovTitle').innerText = 'IDENTIFÍCATE';
      document.getElementById('ovTitle').style.color = '#fb923c';
      document.getElementById('ovDesc').innerText = 'Escribe tu nombre para empezar la tarea';
      document.getElementById('busyAlert').style.display = 'none';
      const input = document.getElementById('playerName');
      input.style.display = 'block';
      input.value = '';
      input.focus();
      document.getElementById('btnStart').innerText = 'Continuar';
      document.getElementById('btnStart').style.display = 'block';
      document.getElementById('btnRetry').style.display = 'none';
    }

    async function checkPlayer() {
      const input = document.getElementById('playerName');
      const name = input.value.trim().toUpperCase();
      if (!name) return alert('Escribe tu nombre');

      currentPlayer = name;

      // 1. Ya completada
      const { data: doneData } = await client
        .from('completed_tasks')
        .select('*')
        .eq('player_name', currentPlayer)
        .eq('task_name', TASK_ID);

      if (doneData && doneData.length > 0) {
        document.getElementById('ovTitle').innerText = 'TAREA YA COMPLETADA';
        document.getElementById('ovTitle').style.color = '#ef4444';
        document.getElementById('ovDesc').innerText = `Hola ${currentPlayer}, ya completaste esta tarea. Espera a que el admin la reinicie.`;
        input.style.display = 'none';
        document.getElementById('btnStart').style.display = 'none';
        document.getElementById('btnRetry').style.display = 'block';
        return;
      }

      // 2. Comprobar ocupación
      const { data: session } = await client
        .from('active_sessions')
        .select('*')
        .eq('task_name', TASK_ID)
        .maybeSingle();

      const now = Date.now();
      if (session) {
        const lastSeen = new Date(session.last_heartbeat).getTime();
        const secondsAgo = (now - lastSeen) / 1000;

        if (secondsAgo < 12 && session.player_name !== currentPlayer) {
          document.getElementById('ovTitle').innerText = 'ACCESO DENEGADO';
          document.getElementById('ovTitle').style.color = '#ef4444';
          document.getElementById('ovDesc').innerText = 'Solo puede realizarla 1 tripulante a la vez.';
          document.getElementById('busyAlert').style.display = 'block';
          document.getElementById('busyMsg').innerText = `${session.player_name} está usando este panel ahora mismo.`;
          input.style.display = 'none';
          document.getElementById('btnStart').innerText = 'Comprobar si quedó libre';
          document.getElementById('btnStart').style.display = 'block';
          document.getElementById('btnRetry').style.display = 'block';
          return;
        }
      }

      // 3. Tomar turno
      await takeSession();
      document.getElementById('overlay').style.display = 'none';
      heartbeatTimer = setInterval(takeSession, 3000);
      initNavigation();
    }

    async function takeSession() {
      await client.from('active_sessions').upsert({
        task_name: TASK_ID,
        player_name: currentPlayer,
        last_heartbeat: new Date().toISOString()
      });
    }

    async function releaseSession() {
      if (heartbeatTimer) clearInterval(heartbeatTimer);
      if (currentPlayer) {
        await client.from('active_sessions').delete().eq('task_name', TASK_ID).eq('player_name', currentPlayer);
      }
    }

    window.addEventListener('beforeunload', releaseSession);
    window.addEventListener('pagehide', releaseSession);

    const gps = document.getElementById('gps');
    const car = document.getElementById('car');
    const svg = document.getElementById('mapSvg');
    const wpContainer = document.getElementById('waypointsContainer');

    function randomBetween(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function initNavigation() {
      wpContainer.innerHTML = '';
      svg.innerHTML = '';
      currentStep = 1;
      isCompleted = false;

      // Puntos de izquierda a derecha con Y aleatoria en intermedios
      WAYPOINTS = [
        { x: 10, y: randomBetween(35, 65), name: 'Valencia',    icon: 'START' },
        { x: 36, y: randomBetween(25, 75), name: 'Buñol',       icon: '1' },
        { x: 64, y: randomBetween(25, 75), name: 'Utiel',       icon: '2' },
        { x: 90, y: randomBetween(35, 65), name: 'Minglanilla', icon: '🏁' }
      ];

      let pathD = `M ${WAYPOINTS[0].x}% ${WAYPOINTS[0].y}%`;
      for (let i = 1; i < WAYPOINTS.length; i++) {
        pathD += ` L ${WAYPOINTS[i].x}% ${WAYPOINTS[i].y}%`;
      }

      // 1. Línea base tenue para asfalto
      const darkRoad = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      darkRoad.setAttribute('d', pathD);
      darkRoad.setAttribute('stroke', '#292524');
      darkRoad.setAttribute('stroke-width', '10');
      darkRoad.setAttribute('stroke-linecap', 'round');
      darkRoad.setAttribute('stroke-linejoin', 'round');
      darkRoad.setAttribute('fill', 'none');
      svg.appendChild(darkRoad);

      // 2. Línea discontinua visible para guiar la ruta
      const guideLine = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      guideLine.setAttribute('d', pathD);
      guideLine.setAttribute('stroke', '#fdba74');
      guideLine.setAttribute('stroke-width', '4');
      guideLine.setAttribute('stroke-dasharray', '8 6');
      guideLine.setAttribute('stroke-linecap', 'round');
      guideLine.setAttribute('fill', 'none');
      svg.appendChild(guideLine);

      // 3. Línea sólida en negrita para tramos completados
      const boldLine = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      boldLine.id = 'boldRoad';
      boldLine.setAttribute('d', `M ${WAYPOINTS[0].x}% ${WAYPOINTS[0].y}%`);
      boldLine.setAttribute('stroke', '#ea580c');
      boldLine.setAttribute('stroke-width', '10');
      boldLine.setAttribute('stroke-linecap', 'round');
      boldLine.setAttribute('stroke-linejoin', 'round');
      boldLine.setAttribute('fill', 'none');
      svg.appendChild(boldLine);

      // Renderizar nodos
      WAYPOINTS.forEach((wp, idx) => {
        const node = document.createElement('div');
        node.className = 'waypoint-node';
        node.id = `node-${idx}`;
        node.style.left = `${wp.x}%`;
        node.style.top = `${wp.y}%`;

        node.innerHTML = `
          <div class="waypoint-dot">${wp.icon}</div>
          <div class="waypoint-label">${wp.name}</div>
        `;

        if (idx === 0) node.classList.add('reached');
        if (idx === 1) node.classList.add('target');
        wpContainer.appendChild(node);
      });

      setCarPos(WAYPOINTS[0].x, WAYPOINTS[0].y);
    }

    function setCarPos(xPercent, yPercent) {
      car.style.left = `${xPercent}%`;
      car.style.top = `${yPercent}%`;
    }

    car.addEventListener('pointerdown', (e) => {
      if (isCompleted) return;
      isDragging = true;
      car.setPointerCapture(e.pointerId);
      car.style.transition = 'none';
      playBeep(380, 'sine', 0.1);
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging || isCompleted) return;
      const rect = gps.getBoundingClientRect();
      const pointerX = ((e.clientX - rect.left) / rect.width) * 100;
      const pointerY = ((e.clientY - rect.top) / rect.height) * 100;

      const pA = WAYPOINTS[currentStep - 1];
      const pB = WAYPOINTS[currentStep];

      // Proyección matemática sobre el tramo actual
      const dx = pB.x - pA.x;
      const dy = pB.y - pA.y;
      const lenSq = dx * dx + dy * dy;

      let t = ((pointerX - pA.x) * dx + (pointerY - pA.y) * dy) / lenSq;
      t = Math.max(0, Math.min(1, t));

      const clampedX = pA.x + t * dx;
      const clampedY = pA.y + t * dy;

      setCarPos(clampedX, clampedY);

      if (t >= 0.96) {
        reachWaypoint(currentStep);
      }
    });

    window.addEventListener('pointerup', () => {
      if (!isDragging || isCompleted) return;
      isDragging = false;

      // Si suelta antes, vuelve al inicio del tramo
      const prevWp = WAYPOINTS[currentStep - 1];
      car.style.transition = 'left 0.25s ease-out, top 0.25s ease-out';
      setCarPos(prevWp.x, prevWp.y);
      setTimeout(() => car.style.transition = 'none', 260);
    });

    async function reachWaypoint(stepIdx) {
      playBeep(450 + (stepIdx * 90), 'triangle', 0.2);
      if (navigator.vibrate) navigator.vibrate(60);

      const targetNode = document.getElementById(`node-${stepIdx}`);
      targetNode.classList.remove('target');
      targetNode.classList.add('reached');

      // Extender línea completada en negrita
      let boldD = `M ${WAYPOINTS[0].x}% ${WAYPOINTS[0].y}%`;
      for (let i = 1; i <= stepIdx; i++) {
        boldD += ` L ${WAYPOINTS[i].x}% ${WAYPOINTS[i].y}%`;
      }
      document.getElementById('boldRoad').setAttribute('d', boldD);

      currentStep++;

      if (currentStep >= WAYPOINTS.length) {
        isCompleted = true;
        isDragging = false;
        setCarPos(WAYPOINTS[WAYPOINTS.length - 1].x, WAYPOINTS[WAYPOINTS.length - 1].y);

        document.getElementById('status').innerText = '¡TAREA COMPLETADA!';
        playBeep(820, 'sine', 0.4);
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

        await client.from('completed_tasks').insert([{ player_name: currentPlayer, task_name: TASK_ID }]);
        await releaseSession();
      } else {
        document.getElementById(`node-${currentStep}`).classList.add('target');
      }
    }
  </script>
</body>
</html>
