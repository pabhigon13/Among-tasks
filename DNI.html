<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Administración: Pasar DNI</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      background: #090e13;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0.5rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    h2 { margin: 0 0 0.2rem 0; color: #06b6d4; letter-spacing: 2px; font-size: 1.3rem; }
    p { margin: 0 0 0.6rem 0; color: #94a3b8; font-size: 0.82rem; }

    /* Mueble principal */
    .terminal-case {
      position: relative;
      background: #2b3342;
      border: 5px solid #1a202c;
      border-radius: 18px;
      width: 100%;
      max-width: 360px;
      height: 440px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: inset 0 0 25px rgba(0,0,0,0.7), 0 12px 30px rgba(0,0,0,0.6);
      overflow: hidden;
    }

    /* Módulo superior: Datáfono / Ranura Among Us */
    .scanner-module {
      background: #1e2430;
      border: 3px solid #0f172a;
      border-radius: 12px;
      padding: 0.8rem;
      box-shadow: inset 0 3px 8px rgba(0,0,0,0.6);
    }
    .scanner-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #090e15;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      border: 1px solid #334155;
      margin-bottom: 0.8rem;
    }
    .screen-text {
      font-family: "Courier New", monospace;
      font-size: 0.85rem;
      font-weight: 900;
      color: #38bdf8;
      letter-spacing: 1px;
    }
    .leds {
      display: flex;
      gap: 6px;
    }
    .led {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #334155;
      border: 1px solid #000;
    }
    .led.green.on { background: #22c55e; box-shadow: 0 0 10px #22c55e; }
    .led.red.on   { background: #ef4444; box-shadow: 0 0 10px #ef4444; }

    /* Ranura estrecha de pase */
    .swipe-track {
      position: relative;
      background: #05070a;
      border-top: 3px solid #0f172a;
      border-bottom: 3px solid #0f172a;
      height: 28px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      overflow: hidden;
    }
    .track-line {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
    }
    .track-arrow {
      position: absolute;
      right: 12px;
      color: rgba(255,255,255,0.25);
      font-size: 0.8rem;
      font-weight: bold;
      pointer-events: none;
    }

    /* Zona inferior: Cartera abierta */
    .wallet-container {
      position: relative;
      background: #451a03;
      border: 4px solid #270f03;
      border-radius: 14px 14px 4px 4px;
      height: 190px;
      box-shadow: inset 0 8px 18px rgba(0,0,0,0.8);
      overflow: hidden;
    }
    .wallet-stitch {
      position: absolute;
      inset: 4px;
      border: 1px dashed rgba(245, 158, 11, 0.4);
      border-radius: 10px;
      pointer-events: none;
    }

    /* Elementos dentro de la cartera */
    .bill {
      position: absolute;
      width: 130px;
      height: 60px;
      border-radius: 6px;
      border: 1px solid rgba(0,0,0,0.3);
      padding: 4px 8px;
      font-size: 0.75rem;
      font-weight: 900;
      color: rgba(0,0,0,0.5);
      box-shadow: 0 3px 6px rgba(0,0,0,0.4);
      pointer-events: none;
    }
    .bill-50 {
      background: #fb923c;
      top: 15px;
      left: 14px;
      transform: rotate(-7deg);
    }
    .bill-20 {
      background: #60a5fa;
      top: 25px;
      left: 45px;
      transform: rotate(4deg);
    }

    .coins {
      position: absolute;
      bottom: 12px;
      left: 18px;
      display: flex;
      gap: 5px;
      pointer-events: none;
    }
    .coin {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: radial-gradient(circle, #fde047 30%, #ca8a04 100%);
      border: 2px solid #a16207;
      box-shadow: 0 2px 5px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.6rem;
      font-weight: 900;
      color: #713f12;
    }

    .other-card {
      position: absolute;
      width: 120px;
      height: 70px;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 6px;
      top: 50px;
      right: 14px;
      transform: rotate(8deg);
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
      pointer-events: none;
      padding: 6px;
    }
    .other-chip { width: 12px; height: 10px; background: #facc15; border-radius: 2px; }

    /* Bolsillo frontal de cuero (cubre la mitad del DNI al inicio) */
    .wallet-pocket {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 95px;
      background: linear-gradient(180deg, #371502 0%, #220b01 100%);
      border-top: 3px solid #582407;
      box-shadow: 0 -4px 10px rgba(0,0,0,0.6);
      z-index: 5;
      pointer-events: none;
    }

    /* El DNI interactivo */
    #dniCard {
      position: absolute;
      width: 160px;
      height: 100px;
      background: linear-gradient(135deg, #fef08a 0%, #bae6fd 60%, #e0f2fe 100%);
      border: 2px solid #0284c7;
      border-radius: 8px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.7);
      cursor: grab;
      z-index: 4; /* Debajo del bolsillo al inicio */
      padding: 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #0f172a;
    }
    #dniCard:active {
      cursor: grabbing;
    }
    #dniCard.pulled {
      z-index: 20; /* Pasa al frente de todo cuando se saca */
    }

    /* Detalles del DNI */
    .dni-head {
      display: flex;
      justify-content: space-between;
      font-size: 0.48rem;
      font-weight: 900;
      color: #0369a1;
      letter-spacing: 0.5px;
    }
    .dni-mid {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .dni-mugshot {
      width: 32px;
      height: 42px;
      background: #0284c7;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #0369a1;
    }
    .dni-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .chip { width: 14px; height: 11px; background: #f59e0b; border: 1px solid #b45309; border-radius: 2px; margin-bottom: 2px; }
    .bar { height: 3px; background: rgba(15, 23, 42, 0.45); border-radius: 2px; }
    .dni-magstrip {
      height: 12px;
      background: #1e293b;
      border-radius: 2px;
    }

    #status {
      margin-top: 0.8rem;
      font-weight: bold;
      font-size: 1.2rem;
      color: #22c55e;
      min-height: 1.6rem;
      letter-spacing: 1px;
    }

    /* Overlay inicio/bloqueo */
    #overlay {
      position: fixed; inset: 0; background: #090e13; z-index: 50;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem;
    }
    .overlay-input {
      padding: 0.8rem; border-radius: 8px; border: 1px solid #444; background: #1e2430;
      color: #fff; width: 80%; max-width: 250px; text-align: center; font-size: 1rem;
    }
    .overlay-btn {
      margin-top: 1rem; padding: 0.8rem 1.5rem; background: #06b6d4; color: #082f49;
      border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
    }
    .btn-retry {
      margin-top: 1rem; padding: 0.6rem 1.2rem; background: #334155; color: #fff;
      border: none; border-radius: 6px; cursor: pointer; display: none;
    }
    .busy-box {
      background: rgba(239,68,68,0.15); border: 2px solid #ef4444; border-radius: 10px;
      padding: 1rem; margin: 1rem; max-width: 300px; display: none;
    }
  </style>
</head>
<body>

  <div id="overlay">
    <h2 id="ovTitle" style="color: #06b6d4;">IDENTIFÍCATE</h2>
    <p id="ovDesc">Escribe tu nombre para empezar la tarea</p>
    
    <div id="busyAlert" class="busy-box">
      <div style="font-size: 2rem; margin-bottom: 0.3rem;">⏳</div>
      <strong style="color: #ef4444;">TERMINAL OCUPADA</strong>
      <p id="busyMsg" style="font-size: 0.85rem; color: #cbd5e1; margin: 0.4rem 0 0 0;"></p>
    </div>

    <input id="playerName" class="overlay-input" placeholder="Tu nombre..." autocomplete="off" />
    <button id="btnStart" class="overlay-btn" onclick="checkPlayer()">Continuar</button>
    <button id="btnRetry" class="btn-retry" onclick="resetForm()">Intentar con otro nombre</button>
  </div>

  <h2>ADMINISTRACIÓN</h2>
  <p>Saca el DNI de la cartera y pásalo por la ranura</p>

  <div class="terminal-case" id="terminalCase">

    <!-- Lector Among Us -->
    <div class="scanner-module" id="scannerMod">
      <div class="scanner-top">
        <span class="screen-text" id="screenMsg">SAQUE EL DNI</span>
        <div class="leds">
          <div class="led green" id="ledGreen"></div>
          <div class="led red" id="ledRed"></div>
        </div>
      </div>
      <div class="swipe-track" id="swipeTrack">
        <div class="track-line"></div>
        <span class="track-arrow">▶▶▶</span>
      </div>
    </div>

    <!-- Cartera con billetero y monedas -->
    <div class="wallet-container" id="walletCont">
      <div class="wallet-stitch"></div>

      <!-- Decoraciones -->
      <div class="bill bill-50">50 €</div>
      <div class="bill bill-20">20 €</div>
      
      <div class="other-card">
        <div class="other-chip"></div>
      </div>

      <div class="coins">
        <div class="coin">2€</div>
        <div class="coin">1€</div>
      </div>

      <div class="wallet-pocket"></div>
    </div>

    <!-- DNI interactivo -->
    <div id="dniCard">
      <div class="dni-head">
        <span>ESPAÑA - DNI</span>
        <span>TRIPULANTE</span>
      </div>
      <div class="dni-mid">
        <div class="dni-mugshot">
          <svg viewBox="0 0 40 40" width="22" height="22">
            <ellipse cx="20" cy="22" rx="10" ry="14" fill="#38bdf8"/>
            <ellipse cx="23" cy="18" rx="6" ry="4" fill="#bae6fd"/>
          </svg>
        </div>
        <div class="dni-info">
          <div class="chip"></div>
          <div class="bar" style="width: 80%;"></div>
          <div class="bar" style="width: 100%;"></div>
          <div class="bar" style="width: 60%;"></div>
        </div>
      </div>
      <div class="dni-magstrip"></div>
    </div>

  </div>

  <div id="status"></div>

  <script>
    const TASK_ID = 'dni';
    const SUPABASE_URL = 'https://yxgwdxlplvxvnhnsgkja.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4Z3dkeGxwbHZ4dm5obnNna2phIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNDMzMDUsImV4cCI6MjEwNzkxOTMwNX0.qol-pxboTuyShUCVCjs5_qa0FJg5W-TONZjlSopuciQ';
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentPlayer = '';
    let heartbeatTimer = null;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq = 440, type = 'sine', duration = 0.15) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function resetForm() {
      document.getElementById('ovTitle').innerText = 'IDENTIFÍCATE';
      document.getElementById('ovTitle').style.color = '#06b6d4';
      document.getElementById('ovDesc').innerText = 'Escribe tu nombre para empezar la tarea';
      document.getElementById('busyAlert').style.display = 'none';
      const input = document.getElementById('playerName');
      input.style.display = 'block';
      input.value = '';
      input.focus();
      document.getElementById('btnStart').innerText = 'Continuar';
      document.getElementById('btnStart').style.display = 'block';
      document.getElementById('btnRetry').style.display = 'none';
    }

    async function checkPlayer() {
      const input = document.getElementById('playerName');
      const name = input.value.trim().toUpperCase();
      if (!name) return alert('Escribe tu nombre');

      currentPlayer = name;

      const { data: doneData } = await client
        .from('completed_tasks')
        .select('*')
        .eq('player_name', currentPlayer)
        .eq('task_name', TASK_ID);

      if (doneData && doneData.length > 0) {
        document.getElementById('ovTitle').innerText = 'TAREA YA COMPLETADA';
        document.getElementById('ovTitle').style.color = '#ef4444';
        document.getElementById('ovDesc').innerText = `Hola ${currentPlayer}, ya completaste esta tarea. Espera a que el admin la reinicie.`;
        input.style.display = 'none';
        document.getElementById('btnStart').style.display = 'none';
        document.getElementById('btnRetry').style.display = 'block';
        return;
      }

      const { data: session } = await client
        .from('active_sessions')
        .select('*')
        .eq('task_name', TASK_ID)
        .maybeSingle();

      const now = Date.now();
      if (session) {
        const lastSeen = new Date(session.last_heartbeat).getTime();
        const secondsAgo = (now - lastSeen) / 1000;

        if (secondsAgo < 12 && session.player_name !== currentPlayer) {
          document.getElementById('ovTitle').innerText = 'ACCESO DENEGADO';
          document.getElementById('ovTitle').style.color = '#ef4444';
          document.getElementById('ovDesc').innerText = 'Solo puede realizarla 1 tripulante a la vez.';
          document.getElementById('busyAlert').style.display = 'block';
          document.getElementById('busyMsg').innerText = `${session.player_name} está usando este panel ahora mismo.`;
          input.style.display = 'none';
          document.getElementById('btnStart').innerText = 'Comprobar si quedó libre';
          document.getElementById('btnStart').style.display = 'block';
          document.getElementById('btnRetry').style.display = 'block';
          return;
        }
      }

      await takeSession();
      document.getElementById('overlay').style.display = 'none';
      heartbeatTimer = setInterval(takeSession, 3000);
      initCardInsideWallet();
    }

    async function takeSession() {
      await client.from('active_sessions').upsert({
        task_name: TASK_ID,
        player_name: currentPlayer,
        last_heartbeat: new Date().toISOString()
      });
    }

    async function releaseSession() {
      if (heartbeatTimer) clearInterval(heartbeatTimer);
      if (currentPlayer) {
        await client.from('active_sessions').delete().eq('task_name', TASK_ID).eq('player_name', currentPlayer);
      }
    }

    window.addEventListener('beforeunload', releaseSession);
    window.addEventListener('pagehide', releaseSession);

    // Sistema de física y arrastre
    const terminalCase = document.getElementById('terminalCase');
    const dniCard = document.getElementById('dniCard');
    const swipeTrack = document.getElementById('swipeTrack');
    const screenMsg = document.getElementById('screenMsg');
    const ledGreen = document.getElementById('ledGreen');
    const ledRed = document.getElementById('ledRed');

    let isDragging = false;
    let isCompleted = false;
    let isOut = false; // ¿Ha salido ya de la cartera?

    // Variables de paso por ranura
    let swipeStartTime = 0;
    let hasEnteredTrack = false;

    function initCardInsideWallet() {
      // Posición dentro del compartimento inferior
      dniCard.classList.remove('pulled');
      dniCard.style.left = '35px';
      dniCard.style.top = '275px';
      dniCard.style.transition = 'none';
      isOut = false;
      screenMsg.innerText = "SAQUE EL DNI";
      screenMsg.style.color = "#38bdf8";
      ledGreen.classList.remove('on');
      ledRed.classList.remove('on');
    }

    // Centrado táctil exacto bajo el cursor
    dniCard.addEventListener('pointerdown', (e) => {
      if (isCompleted) return;
      isDragging = true;
      hasEnteredTrack = false;
      swipeStartTime = 0;

      dniCard.setPointerCapture(e.pointerId);
      dniCard.style.transition = 'none';
      playBeep(320, 'sine', 0.08);

      moveCardToFinger(e.clientX, e.clientY);
    });

    function moveCardToFinger(clientX, clientY) {
      const cRect = terminalCase.getBoundingClientRect();
      const cardW = 160;
      const cardH = 100;

      // El dedo queda justo en el centro de la tarjeta
      let x = (clientX - cRect.left) - (cardW / 2);
      let y = (clientY - cRect.top) - (cardH / 2);

      dniCard.style.left = `${x}px`;
      dniCard.style.top = `${y}px`;

      // Si se eleva hacia arriba, sale formalmente de la cartera
      if (y < 230 && !isOut) {
        isOut = true;
        dniCard.classList.add('pulled');
        screenMsg.innerText = "DESLICE EL DNI";
        screenMsg.style.color = "#facc15";
      }

      // Comprobar interacción con la ranura horizontal
      const cardRect = dniCard.getBoundingClientRect();
      const trackRect = swipeTrack.getBoundingClientRect();

      // ¿La banda magnética (zona inferior del DNI) cruza la hendidura?
      const inTrackHeight = (cardRect.bottom >= trackRect.top) && (cardRect.bottom <= trackRect.bottom + 45);
      const atStart = cardRect.left <= trackRect.left + 50;
      const atEnd = cardRect.right >= trackRect.right - 20;

      if (isOut && inTrackHeight && atStart && !hasEnteredTrack) {
        hasEnteredTrack = true;
        swipeStartTime = performance.now();
        playBeep(480, 'square', 0.05);
      }

      if (hasEnteredTrack && atEnd) {
        finishSwipe();
      }
    }

    window.addEventListener('pointermove', (e) => {
      if (!isDragging || isCompleted) return;
      moveCardToFinger(e.clientX, e.clientY);
    });

    window.addEventListener('pointerup', () => {
      if (!isDragging || isCompleted) return;
      isDragging = false;

      // Si no se completó la pasada, vuelve a la cartera
      dniCard.style.transition = 'left 0.3s ease, top 0.3s ease';
      initCardInsideWallet();

      if (hasEnteredTrack) {
        showError("LECTURA INCOMPLETA");
      }
    });

    async function finishSwipe() {
      isDragging = false;
      const duration = performance.now() - swipeStartTime;

      if (duration < 340) {
        showError("DEMASIADO RÁPIDO");
        reboundToWallet();
      } else if (duration > 1150) {
        showError("DEMASIADO LENTO");
        reboundToWallet();
      } else {
        // Éxito
        isCompleted = true;
        screenMsg.innerText = "ACEPTADO";
        screenMsg.style.color = "#22c55e";
        ledGreen.classList.add('on');
        ledRed.classList.remove('on');

        document.getElementById('status').innerText = '¡TAREA COMPLETADA!';
        playBeep(750, 'sine', 0.18);
        setTimeout(() => playBeep(1000, 'sine', 0.3), 150);
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

        await client.from('completed_tasks').insert([{ player_name: currentPlayer, task_name: TASK_ID }]);
        await releaseSession();
      }
    }

    function showError(msg) {
      screenMsg.innerText = msg;
      screenMsg.style.color = "#ef4444";
      ledRed.classList.add('on');
      ledGreen.classList.remove('on');
      playBeep(180, 'sawtooth', 0.25);
      if (navigator.vibrate) navigator.vibrate(200);

      setTimeout(() => {
        if (!isCompleted) {
          screenMsg.innerText = isOut ? "DESLICE EL DNI" : "SAQUE EL DNI";
          screenMsg.style.color = isOut ? "#facc15" : "#38bdf8";
          ledRed.classList.remove('on');
        }
      }, 1300);
    }

    function reboundToWallet() {
      dniCard.style.transition = 'left 0.35s ease, top 0.35s ease';
      initCardInsideWallet();
    }
  </script>
</body>
</html>
