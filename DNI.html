<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Administración: Pasar DNI</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      background: #090e13;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0.5rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    h2 { margin: 0 0 0.2rem 0; color: #f43f5e; letter-spacing: 2px; font-size: 1.3rem; }
    p { margin: 0 0 0.6rem 0; color: #94a3b8; font-size: 0.82rem; }

    /* Mueble principal */
    .terminal-case {
      position: relative;
      background: #242933;
      border: 5px solid #15181e;
      border-radius: 18px;
      width: 100%;
      max-width: 360px;
      height: 450px;
      padding: 0.9rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: inset 0 0 25px rgba(0,0,0,0.8), 0 12px 30px rgba(0,0,0,0.7);
      overflow: hidden;
    }

    /* Módulo superior: Datáfono */
    .scanner-module {
      position: relative;
      background: #181d26;
      border: 3px solid #0f1217;
      border-radius: 12px;
      padding: 0.7rem;
      box-shadow: inset 0 3px 8px rgba(0,0,0,0.6);
      z-index: 10;
    }
    .scanner-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0b0e14;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      border: 1px solid #334155;
      margin-bottom: 0.6rem;
    }
    .screen-text {
      font-family: "Courier New", monospace;
      font-size: 0.85rem;
      font-weight: 900;
      color: #fb7185;
      letter-spacing: 1px;
    }
    .leds { display: flex; gap: 6px; }
    .led {
      width: 12px; height: 12px; border-radius: 50%;
      background: #334155; border: 1px solid #000;
    }
    .led.green.on { background: #22c55e; box-shadow: 0 0 10px #22c55e; }
    .led.red.on   { background: #ef4444; box-shadow: 0 0 10px #ef4444; }

    /* Estructura de ranura con efecto inserción */
    .slot-assembly {
      position: relative;
      height: 38px;
      background: #05070a;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      align-items: center;
      border-top: 3px solid #000;
    }
    .slot-guideline {
      position: absolute;
      left: 10px; right: 10px; height: 2px;
      background: rgba(255,255,255,0.15);
    }
    .slot-arrow {
      position: absolute; right: 12px;
      color: rgba(255,255,255,0.25);
      font-size: 0.85rem; font-weight: bold; pointer-events: none;
    }
    /* Labio frontal del lector que oculta la parte baja del DNI al pasar */
    .slot-front-lip {
      position: absolute;
      bottom: 0; left: 0; right: 0; height: 18px;
      background: linear-gradient(180deg, #1f2530 0%, #161a22 100%);
      border-top: 2px solid #2d3748;
      box-shadow: 0 -2px 6px rgba(0,0,0,0.7);
      z-index: 25;
      pointer-events: none;
    }

    /* Zona inferior: Cartera de piel */
    .wallet-container {
      position: relative;
      background: #3e1704;
      border: 4px solid #220b02;
      border-radius: 14px 14px 6px 6px;
      height: 200px;
      box-shadow: inset 0 8px 18px rgba(0,0,0,0.85);
      overflow: hidden;
    }
    .wallet-stitch {
      position: absolute; inset: 4px;
      border: 1px dashed rgba(245, 158, 11, 0.45);
      border-radius: 10px; pointer-events: none;
    }

    /* --- Billete de 20€ realista --- */
    .euro-20 {
      position: absolute;
      top: 15px; left: 16px;
      width: 145px; height: 75px;
      background: linear-gradient(135deg, #3b82f6 0%, #60a5fa 35%, #93c5fd 65%, #2563eb 100%);
      border: 1px solid #1d4ed8;
      border-radius: 4px;
      transform: rotate(-6deg);
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
      padding: 5px 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      pointer-events: none;
    }
    .euro-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      color: #fff; font-size: 0.55rem; font-weight: 900;
    }
    .euro-flag {
      width: 16px; height: 11px; background: #1e3a8a;
      border: 0.5px solid #fff; border-radius: 1px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.45rem; color: #facc15;
    }
    .euro-arch {
      position: absolute; top: 18px; left: 24px;
      width: 44px; height: 38px;
      border: 2px solid rgba(255,255,255,0.45);
      border-radius: 20px 20px 0 0;
    }
    .euro-holo {
      position: absolute; right: 8px; top: 0; bottom: 0; width: 14px;
      background: linear-gradient(180deg, #e2e8f0 0%, #cbd5e1 50%, #94a3b8 100%);
      opacity: 0.75; border-left: 0.5px solid rgba(255,255,255,0.6);
    }
    .euro-val {
      font-size: 1.15rem; font-weight: 900; color: #1e3a8a;
      text-shadow: 1px 1px 0 rgba(255,255,255,0.5); line-height: 1;
    }

    /* --- Tarjeta de crédito bancaria realista --- */
    .bank-card {
      position: absolute;
      top: 36px; right: 14px;
      width: 135px; height: 85px;
      background: linear-gradient(145deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid #475569;
      border-radius: 6px;
      transform: rotate(7deg);
      box-shadow: 0 5px 12px rgba(0,0,0,0.6);
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
    }
    .card-top-row {
      display: flex; justify-content: space-between; align-items: center;
    }
    .bank-chip {
      width: 16px; height: 13px;
      background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
      border: 0.5px solid #78350f; border-radius: 2px;
    }
    .contactless {
      font-size: 0.65rem; color: #94a3b8; font-weight: bold;
    }
    .card-numbers {
      font-family: "Courier New", monospace;
      font-size: 0.55rem; color: #cbd5e1; letter-spacing: 1px;
    }
    .card-bottom-row {
      display: flex; justify-content: space-between; align-items: center;
    }
    .cardholder {
      font-size: 0.45rem; color: #94a3b8; text-transform: uppercase; font-weight: bold;
    }
    .mastercard-logo {
      display: flex; position: relative; width: 22px; height: 13px;
    }
    .mc-circle-red {
      width: 13px; height: 13px; border-radius: 50%;
      background: #ef4444; position: absolute; left: 0;
    }
    .mc-circle-yellow {
      width: 13px; height: 13px; border-radius: 50%;
      background: #f59e0b; position: absolute; right: 0; opacity: 0.85;
    }

    /* Moneda 2€ */
    .coin-2euro {
      position: absolute; bottom: 12px; left: 16px;
      width: 28px; height: 28px; border-radius: 50%;
      background: radial-gradient(circle, #fde047 50%, #ca8a04 100%);
      border: 3.5px solid #cbd5e1;
      box-shadow: 0 3px 6px rgba(0,0,0,0.7);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.65rem; font-weight: 900; color: #713f12;
      pointer-events: none;
    }

    /* Bolsillo frontal de la cartera */
    .wallet-pocket {
      position: absolute; bottom: 0; left: 0; right: 0; height: 105px;
      background: linear-gradient(180deg, #301103 0%, #1e0901 100%);
      border-top: 3px solid #582407;
      box-shadow: 0 -4px 10px rgba(0,0,0,0.65);
      z-index: 5;
      pointer-events: none;
    }

    /* --- El DNI interactivo --- */
    #dniCard {
      position: absolute;
      width: 160px; height: 100px;
      background: linear-gradient(135deg, #fef08a 0%, #bae6fd 60%, #e0f2fe 100%);
      border: 2px solid #0284c7;
      border-radius: 8px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.7);
      cursor: grab;
      z-index: 4; /* Dentro de la cartera al inicio */
      padding: 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #0f172a;
    }
    #dniCard:active { cursor: grabbing; }
    #dniCard.pulled {
      z-index: 20; /* Queda detrás del labio frontal (25) para meterse en la ranura */
    }

    .dni-head {
      display: flex; justify-content: space-between;
      font-size: 0.48rem; font-weight: 900; color: #0369a1; letter-spacing: 0.5px;
    }
    .dni-mid { display: flex; gap: 8px; align-items: center; }
    .dni-mugshot {
      width: 32px; height: 42px; background: #0284c7;
      border-radius: 4px; display: flex; align-items: center; justify-content: center;
      border: 1px solid #0369a1;
    }
    .dni-info { flex: 1; display: flex; flex-direction: column; gap: 3px; }
    .dni-chip-icon {
      width: 14px; height: 11px; background: #f59e0b;
      border: 1px solid #b45309; border-radius: 2px; margin-bottom: 2px;
    }
    .bar { height: 3px; background: rgba(15, 23, 42, 0.45); border-radius: 2px; }
    .dni-magstrip {
      height: 14px; background: #1e293b; border-radius: 2px;
    }

    #status {
      margin-top: 0.8rem;
      font-weight: bold;
      font-size: 1.2rem;
      color: #22c55e;
      min-height: 1.6rem;
      letter-spacing: 1px;
    }

    /* Capa de inicio y bloqueo */
    #overlay {
      position: fixed; inset: 0; background: #090e13; z-index: 50;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem;
    }
    .overlay-input {
      padding: 0.8rem; border-radius: 8px; border: 1px solid #444; background: #1e2430;
      color: #fff; width: 80%; max-width: 250px; text-align: center; font-size: 1rem;
    }
    .overlay-btn {
      margin-top: 1rem; padding: 0.8rem 1.5rem; background: #f43f5e; color: #fff;
      border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
    }
    .btn-retry {
      margin-top: 1rem; padding: 0.6rem 1.2rem; background: #334155; color: #fff;
      border: none; border-radius: 6px; cursor: pointer; display: none;
    }
    .busy-box {
      background: rgba(239,68,68,0.15); border: 2px solid #ef4444; border-radius: 10px;
      padding: 1rem; margin: 1rem; max-width: 300px; display: none;
    }
  </style>
</head>
<body>

  <!-- Overlay -->
  <div id="overlay">
    <h2 id="ovTitle" style="color: #f43f5e;">IDENTIFÍCATE</h2>
    <p id="ovDesc">Escribe tu nombre para empezar la tarea</p>
    
    <div id="busyAlert" class="busy-box">
      <div style="font-size: 2rem; margin-bottom: 0.3rem;">⏳</div>
      <strong style="color: #ef4444;">TERMINAL OCUPADA</strong>
      <p id="busyMsg" style="font-size: 0.85rem; color: #cbd5e1; margin: 0.4rem 0 0 0;"></p>
    </div>

    <input id="playerName" class="overlay-input" placeholder="Tu nombre..." autocomplete="off" />
    <button id="btnStart" class="overlay-btn" onclick="checkPlayer()">Continuar</button>
    <button id="btnRetry" class="btn-retry" onclick="resetForm()">Intentar con otro nombre</button>
  </div>

  <h2>ADMINISTRACIÓN</h2>
  <p>Saca el DNI de la cartera y pásalo por la ranura</p>

  <div class="terminal-case" id="terminalCase">

    <!-- Datáfono superior -->
    <div class="scanner-module" id="scannerMod">
      <div class="scanner-top">
        <span class="screen-text" id="screenMsg">SAQUE EL DNI</span>
        <div class="leds">
          <div class="led green" id="ledGreen"></div>
          <div class="led red" id="ledRed"></div>
        </div>
      </div>
      
      <!-- Ranura con ranurado real -->
      <div class="slot-assembly" id="slotAssembly">
        <div class="slot-guideline"></div>
        <span class="slot-arrow">▶▶▶</span>
        <div class="slot-front-lip"></div>
      </div>
    </div>

    <!-- Cartera realista -->
    <div class="wallet-container" id="walletCont">
      <div class="wallet-stitch"></div>

      <!-- Billete de 20€ -->
      <div class="euro-20">
        <div class="euro-header">
          <div class="euro-flag">★</div>
          <span style="font-size: 0.5rem; letter-spacing: 0.5px;">BCE ECB EZB</span>
        </div>
        <div class="euro-arch"></div>
        <div class="euro-holo"></div>
        <div class="euro-val">20</div>
      </div>

      <!-- Tarjeta bancaria -->
      <div class="bank-card">
        <div class="card-top-row">
          <div class="bank-chip"></div>
          <span class="contactless">))))</span>
        </div>
        <div class="card-numbers">•••• 8492</div>
        <div class="card-bottom-row">
          <span class="cardholder">CREW MEMBER</span>
          <div class="mastercard-logo">
            <div class="mc-circle-red"></div>
            <div class="mc-circle-yellow"></div>
          </div>
        </div>
      </div>

      <!-- Moneda 2€ -->
      <div class="coin-2euro">2€</div>

      <!-- Bolsillo -->
      <div class="wallet-pocket"></div>
    </div>

    <!-- DNI -->
    <div id="dniCard">
      <div class="dni-head">
        <span>ESPAÑA - DNI</span>
        <span>TRIPULANTE</span>
      </div>
      <div class="dni-mid">
        <div class="dni-mugshot">
          <svg viewBox="0 0 40 40" width="22" height="22">
            <ellipse cx="20" cy="22" rx="10" ry="14" fill="#38bdf8"/>
            <ellipse cx="23" cy="18" rx="6" ry="4" fill="#bae6fd"/>
          </svg>
        </div>
        <div class="dni-info">
          <div class="dni-chip-icon"></div>
          <div class="bar" style="width: 80%;"></div>
          <div class="bar" style="width: 100%;"></div>
          <div class="bar" style="width: 60%;"></div>
        </div>
      </div>
      <div class="dni-magstrip"></div>
    </div>

  </div>

  <div id="status"></div>

  <script>
    const TASK_ID = 'dni';
    const SUPABASE_URL = 'https://yxgwdxlplvxvnhnsgkja.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4Z3dkeGxwbHZ4dm5obnNna2phIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNDMzMDUsImV4cCI6MjEwNzkxOTMwNX0.qol-pxboTuyShUCVCjs5_qa0FJg5W-TONZjlSopuciQ';
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentPlayer = '';
    let heartbeatTimer = null;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq = 440, type = 'sine', duration = 0.15) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function resetForm() {
      document.getElementById('ovTitle').innerText = 'IDENTIFÍCATE';
      document.getElementById('ovTitle').style.color = '#f43f5e';
      document.getElementById('ovDesc').innerText = 'Escribe tu nombre para empezar la tarea';
      document.getElementById('busyAlert').style.display = 'none';
      const input = document.getElementById('playerName');
      input.style.display = 'block';
      input.value = '';
      input.focus();
      document.getElementById('btnStart').innerText = 'Continuar';
      document.getElementById('btnStart').style.display = 'block';
      document.getElementById('btnRetry').style.display = 'none';
    }

    async function checkPlayer() {
      const input = document.getElementById('playerName');
      const name = input.value.trim().toUpperCase();
      if (!name) return alert('Escribe tu nombre');

      currentPlayer = name;

      const { data: doneData } = await client
        .from('completed_tasks')
        .select('*')
        .eq('player_name', currentPlayer)
        .eq('task_name', TASK_ID);

      if (doneData && doneData.length > 0) {
        document.getElementById('ovTitle').innerText = 'TAREA YA COMPLETADA';
        document.getElementById('ovTitle').style.color = '#ef4444';
        document.getElementById('ovDesc').innerText = `Hola ${currentPlayer}, ya completaste esta tarea. Espera a que el admin la reinicie.`;
        input.style.display = 'none';
        document.getElementById('btnStart').style.display = 'none';
        document.getElementById('btnRetry').style.display = 'block';
        return;
      }

      const { data: session } = await client
        .from('active_sessions')
        .select('*')
        .eq('task_name', TASK_ID)
        .maybeSingle();

      const now = Date.now();
      if (session) {
        const lastSeen = new Date(session.last_heartbeat).getTime();
        const secondsAgo = (now - lastSeen) / 1000;

        if (secondsAgo < 12 && session.player_name !== currentPlayer) {
          document.getElementById('ovTitle').innerText = 'ACCESO DENEGADO';
          document.getElementById('ovTitle').style.color = '#ef4444';
          document.getElementById('ovDesc').innerText = 'Solo puede realizarla 1 tripulante a la vez.';
          document.getElementById('busyAlert').style.display = 'block';
          document.getElementById('busyMsg').innerText = `${session.player_name} está usando este panel ahora mismo.`;
          input.style.display = 'none';
          document.getElementById('btnStart').innerText = 'Comprobar si quedó libre';
          document.getElementById('btnStart').style.display = 'block';
          document.getElementById('btnRetry').style.display = 'block';
          return;
        }
      }

      await takeSession();
      document.getElementById('overlay').style.display = 'none';
      heartbeatTimer = setInterval(takeSession, 3000);
      initCardInsideWallet();
    }

    async function takeSession() {
      await client.from('active_sessions').upsert({
        task_name: TASK_ID,
        player_name: currentPlayer,
        last_heartbeat: new Date().toISOString()
      });
    }

    async function releaseSession() {
      if (heartbeatTimer) clearInterval(heartbeatTimer);
      if (currentPlayer) {
        await client.from('active_sessions').delete().eq('task_name', TASK_ID).eq('player_name', currentPlayer);
      }
    }

    window.addEventListener('beforeunload', releaseSession);
    window.addEventListener('pagehide', releaseSession);

    // Sistema de física y ranura
    const terminalCase = document.getElementById('terminalCase');
    const dniCard = document.getElementById('dniCard');
    const slotAssembly = document.getElementById('slotAssembly');
    const screenMsg = document.getElementById('screenMsg');
    const ledGreen = document.getElementById('ledGreen');
    const ledRed = document.getElementById('ledRed');

    let isDragging = false;
    let isCompleted = false;
    let isOut = false;

    let swipeStartTime = 0;
    let hasEnteredTrack = false;

    function initCardInsideWallet() {
      dniCard.classList.remove('pulled');
      dniCard.style.left = '35px';
      dniCard.style.top = '275px';
      dniCard.style.transition = 'none';
      isOut = false;
      screenMsg.innerText = "SAQUE EL DNI";
      screenMsg.style.color = "#fb7185";
      ledGreen.classList.remove('on');
      ledRed.classList.remove('on');
    }

    dniCard.addEventListener('pointerdown', (e) => {
      if (isCompleted) return;
      isDragging = true;
      hasEnteredTrack = false;
      swipeStartTime = 0;

      dniCard.setPointerCapture(e.pointerId);
      dniCard.style.transition = 'none';
      playBeep(320, 'sine', 0.08);

      moveCardToFinger(e.clientX, e.clientY);
    });

    function moveCardToFinger(clientX, clientY) {
      const cRect = terminalCase.getBoundingClientRect();
      const cardW = 160;
      const cardH = 100;

      // El dedo/cursor se mantiene centrado con precisión
      let x = (clientX - cRect.left) - (cardW / 2);
      let y = (clientY - cRect.top) - (cardH / 2);

      dniCard.style.left = `${x}px`;
      dniCard.style.top = `${y}px`;

      // Sacar de la cartera
      if (y < 235 && !isOut) {
        isOut = true;
        dniCard.classList.add('pulled');
        screenMsg.innerText = "DESLICE EL DNI";
        screenMsg.style.color = "#facc15";
      }

      // Comprobación de inserción en la ranura
      const cardRect = dniCard.getBoundingClientRect();
      const slotRect = slotAssembly.getBoundingClientRect();

      // La base del DNI debe penetrar la ranura (entre su borde superior e inferior)
      const isInsertedInSlot = (cardRect.bottom >= slotRect.top + 6) && (cardRect.bottom <= slotRect.bottom + 14);
      const atStart = cardRect.left <= slotRect.left + 50;
      const atEnd = cardRect.right >= slotRect.right - 20;

      if (isOut && isInsertedInSlot && atStart && !hasEnteredTrack) {
        hasEnteredTrack = true;
        swipeStartTime = performance.now();
        playBeep(480, 'square', 0.05);
      }

      if (hasEnteredTrack && atEnd) {
        finishSwipe();
      }
    }

    window.addEventListener('pointermove', (e) => {
      if (!isDragging || isCompleted) return;
      moveCardToFinger(e.clientX, e.clientY);
    });

    window.addEventListener('pointerup', () => {
      if (!isDragging || isCompleted) return;
      isDragging = false;

      dniCard.style.transition = 'left 0.3s ease, top 0.3s ease';
      initCardInsideWallet();

      if (hasEnteredTrack) {
        showError("LECTURA INCOMPLETA");
      }
    });

    async function finishSwipe() {
      isDragging = false;
      const duration = performance.now() - swipeStartTime;

      if (duration < 330) {
        showError("DEMASIADO RÁPIDO");
        reboundToWallet();
      } else if (duration > 1200) {
        showError("DEMASIADO LENTO");
        reboundToWallet();
      } else {
        isCompleted = true;
        screenMsg.innerText = "ACEPTADO";
        screenMsg.style.color = "#22c55e";
        ledGreen.classList.add('on');
        ledRed.classList.remove('on');

        document.getElementById('status').innerText = '¡TAREA COMPLETADA!';
        playBeep(750, 'sine', 0.18);
        setTimeout(() => playBeep(1000, 'sine', 0.3), 150);
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

        await client.from('completed_tasks').insert([{ player_name: currentPlayer, task_name: TASK_ID }]);
        await releaseSession();
      }
    }

    function showError(msg) {
      screenMsg.innerText = msg;
      screenMsg.style.color = "#ef4444";
      ledRed.classList.add('on');
      ledGreen.classList.remove('on');
      playBeep(180, 'sawtooth', 0.25);
      if (navigator.vibrate) navigator.vibrate(200);

      setTimeout(() => {
        if (!isCompleted) {
          screenMsg.innerText = isOut ? "DESLICE EL DNI" : "SAQUE EL DNI";
          screenMsg.style.color = isOut ? "#facc15" : "#fb7185";
          ledRed.classList.remove('on');
        }
      }, 1300);
    }

    function reboundToWallet() {
      dniCard.style.transition = 'left 0.35s ease, top 0.35s ease';
      initCardInsideWallet();
    }
  </script>
</body>
</html>
