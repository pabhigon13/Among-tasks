<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mantenimiento: Calibración Numérica</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      background: #080d08;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0.8rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    h2 { margin: 0 0 0.2rem 0; color: #a3e635; letter-spacing: 2px; font-size: 1.3rem; }
    p { margin: 0 0 0.8rem 0; color: #94a3b8; font-size: 0.85rem; }

    /* Mueble principal */
    .calc-terminal {
      background: #141f14;
      border: 4px solid #283e28;
      border-radius: 18px;
      width: 100%;
      max-width: 350px;
      padding: 1.2rem;
      box-shadow: inset 0 0 25px rgba(0,0,0,0.8), 0 12px 30px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* Pantalla LCD superior */
    .screen-calc {
      background: #040804;
      border: 3px solid #1c2b1c;
      border-radius: 12px;
      padding: 1rem 0.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 75px;
      box-shadow: inset 0 4px 10px rgba(0,0,0,0.9);
      font-family: "Courier New", monospace;
    }
    .math-expression {
      font-size: 1.5rem;
      font-weight: 900;
      color: #bef264;
      letter-spacing: 2px;
      white-space: nowrap;
    }
    .equal-sign {
      font-size: 1.5rem;
      font-weight: 900;
      color: #a3e635;
    }

    /* Cuadraditos de los dígitos de respuesta */
    .digit-boxes {
      display: flex;
      gap: 6px;
    }
    .digit-box {
      width: 32px;
      height: 42px;
      background: #0f1a0f;
      border: 2px solid #3f6212;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 900;
      color: #f7fee7;
      box-shadow: 0 0 6px rgba(163, 230, 53, 0.2);
    }
    .digit-box.active-cursor {
      border-color: #a3e635;
      box-shadow: 0 0 10px #a3e635;
      animation: pulseCursor 1s infinite alternate;
    }
    .digit-box.error {
      background: #450a0a;
      border-color: #ef4444;
      color: #fca5a5;
    }

    @keyframes pulseCursor {
      from { border-color: #65a30d; }
      to { border-color: #bef264; }
    }

    /* Teclado numérico */
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .key-btn {
      aspect-ratio: 1.25;
      background: #1e2e1e;
      border: 2px solid #365314;
      border-radius: 10px;
      color: #d9f99d;
      font-size: 1.5rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 0 #14200d;
      transition: all 0.08s;
    }
    .key-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #14200d;
      background: #2b422b;
    }
    .key-btn.btn-action-del {
      background: #3a2218;
      border-color: #7c2d12;
      color: #fdba74;
      box-shadow: 0 4px 0 #20110b;
      font-size: 1.4rem;
    }
    .key-btn.btn-action-enter {
      background: #14532d;
      border-color: #15803d;
      color: #86efac;
      box-shadow: 0 4px 0 #0b2e19;
      font-size: 1.4rem;
    }

    #status {
      margin-top: 1rem;
      font-weight: bold;
      font-size: 1.2rem;
      color: #22c55e;
      min-height: 1.6rem;
      letter-spacing: 1px;
    }

    /* Capa de inicio y bloqueo */
    #overlay {
      position: fixed; inset: 0; background: #080d08; z-index: 50;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem;
    }
    .overlay-input {
      padding: 0.8rem; border-radius: 8px; border: 1px solid #444; background: #1e2430;
      color: #fff; width: 80%; max-width: 250px; text-align: center; font-size: 1rem;
    }
    .overlay-btn {
      margin-top: 1rem; padding: 0.8rem 1.5rem; background: #65a30d; color: #fff;
      border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
    }
    .btn-retry {
      margin-top: 1rem; padding: 0.6rem 1.2rem; background: #334155; color: #fff;
      border: none; border-radius: 6px; cursor: pointer; display: none;
    }
    .busy-box {
      background: rgba(239,68,68,0.15); border: 2px solid #ef4444; border-radius: 10px;
      padding: 1rem; margin: 1rem; max-width: 300px; display: none;
    }
  </style>
</head>
<body>

  <!-- Overlay -->
  <div id="overlay">
    <h2 id="ovTitle" style="color: #a3e635;">IDENTIFÍCATE</h2>
    <p id="ovDesc">Escribe tu nombre para empezar la tarea</p>
    
    <div id="busyAlert" class="busy-box">
      <div style="font-size: 2rem; margin-bottom: 0.3rem;">⏳</div>
      <strong style="color: #ef4444;">TERMINAL OCUPADA</strong>
      <p id="busyMsg" style="font-size: 0.85rem; color: #cbd5e1; margin: 0.4rem 0 0 0;"></p>
    </div>

    <input id="playerName" class="overlay-input" placeholder="Tu nombre..." autocomplete="off" />
    <button id="btnStart" class="overlay-btn" onclick="checkPlayer()">Continuar</button>
    <button id="btnRetry" class="btn-retry" onclick="resetForm()">Intentar con otro nombre</button>
  </div>

  <h2>OPERACIÓN</h2>
  <p>Resuelve el cálculo numérico para calibrar el sistema</p>

  <div class="calc-terminal">
    <!-- Pantalla LCD -->
    <div class="screen-calc">
      <div class="math-expression" id="mathExp">-- ? --</div>
      <div class="equal-sign">=</div>
      <div class="digit-boxes" id="digitBoxes"></div>
    </div>

    <!-- Teclado Numérico con ⌫ a la izquierda y ↵ a la derecha del 0 -->
    <div class="keypad">
      <button class="key-btn" onclick="pressDigit(1)">1</button>
      <button class="key-btn" onclick="pressDigit(2)">2</button>
      <button class="key-btn" onclick="pressDigit(3)">3</button>

      <button class="key-btn" onclick="pressDigit(4)">4</button>
      <button class="key-btn" onclick="pressDigit(5)">5</button>
      <button class="key-btn" onclick="pressDigit(6)">6</button>

      <button class="key-btn" onclick="pressDigit(7)">7</button>
      <button class="key-btn" onclick="pressDigit(8)">8</button>
      <button class="key-btn" onclick="pressDigit(9)">9</button>

      <button class="key-btn btn-action-del" onclick="deleteDigit()">⌫</button>
      <button class="key-btn" onclick="pressDigit(0)">0</button>
      <button class="key-btn btn-action-enter" onclick="checkAnswer()">↵</button>
    </div>
  </div>

  <div id="status"></div>

  <script>
    const TASK_ID = 'operacion';
    const SUPABASE_URL = 'https://yxgwdxlplvxvnhnsgkja.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4Z3dkeGxwbHZ4dm5obnNna2phIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNDMzMDUsImV4cCI6MjEwNzkxOTMwNX0.qol-pxboTuyShUCVCjs5_qa0FJg5W-TONZjlSopuciQ';
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentPlayer = '';
    let heartbeatTimer = null;

    // Variables de la operación
    let correctAnswer = 0;
    let requiredLength = 0;
    let enteredDigits = "";
    let isLocked = false;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq = 440, type = 'sine', duration = 0.12) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.14, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function resetForm() {
      document.getElementById('ovTitle').innerText = 'IDENTIFÍCATE';
      document.getElementById('ovTitle').style.color = '#a3e635';
      document.getElementById('ovDesc').innerText = 'Escribe tu nombre para empezar la tarea';
      document.getElementById('busyAlert').style.display = 'none';
      const input = document.getElementById('playerName');
      input.style.display = 'block';
      input.value = '';
      input.focus();
      document.getElementById('btnStart').innerText = 'Continuar';
      document.getElementById('btnStart').style.display = 'block';
      document.getElementById('btnRetry').style.display = 'none';
    }

    async function checkPlayer() {
      const input = document.getElementById('playerName');
      const name = input.value.trim().toUpperCase();
      if (!name) return alert('Escribe tu nombre');

      currentPlayer = name;

      const { data: doneData } = await client
        .from('completed_tasks')
        .select('*')
        .eq('player_name', currentPlayer)
        .eq('task_name', TASK_ID);

      if (doneData && doneData.length > 0) {
        document.getElementById('ovTitle').innerText = 'TAREA YA COMPLETADA';
        document.getElementById('ovTitle').style.color = '#ef4444';
        document.getElementById('ovDesc').innerText = `Hola ${currentPlayer}, ya completaste esta tarea. Espera a que el admin la reinicie.`;
        input.style.display = 'none';
        document.getElementById('btnStart').style.display = 'none';
        document.getElementById('btnRetry').style.display = 'block';
        return;
      }

      const { data: session } = await client
        .from('active_sessions')
        .select('*')
        .eq('task_name', TASK_ID)
        .maybeSingle();

      const now = Date.now();
      if (session) {
        const lastSeen = new Date(session.last_heartbeat).getTime();
        const secondsAgo = (now - lastSeen) / 1000;

        if (secondsAgo < 12 && session.player_name !== currentPlayer) {
          document.getElementById('ovTitle').innerText = 'ACCESO DENEGADO';
          document.getElementById('ovTitle').style.color = '#ef4444';
          document.getElementById('ovDesc').innerText = 'Solo puede realizarla 1 tripulante a la vez.';
          document.getElementById('busyAlert').style.display = 'block';
          document.getElementById('busyMsg').innerText = `${session.player_name} está usando este panel ahora mismo.`;
          input.style.display = 'none';
          document.getElementById('btnStart').innerText = 'Comprobar si quedó libre';
          document.getElementById('btnStart').style.display = 'block';
          document.getElementById('btnRetry').style.display = 'block';
          return;
        }
      }

      await takeSession();
      document.getElementById('overlay').style.display = 'none';
      heartbeatTimer = setInterval(takeSession, 3000);
      generateMathProblem();
    }

    async function takeSession() {
      await client.from('active_sessions').upsert({
        task_name: TASK_ID,
        player_name: currentPlayer,
        last_heartbeat: new Date().toISOString()
      });
    }

    async function releaseSession() {
      if (heartbeatTimer) clearInterval(heartbeatTimer);
      if (currentPlayer) {
        await client.from('active_sessions').delete().eq('task_name', TASK_ID).eq('player_name', currentPlayer);
      }
    }

    window.addEventListener('beforeunload', releaseSession);
    window.addEventListener('pagehide', releaseSession);

    // Generador de Operaciones
    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generateMathProblem() {
      enteredDigits = "";
      isLocked = false;
      const opTypes = ['add', 'sub', 'mul', 'div'];
      const chosenType = opTypes[Math.floor(Math.random() * opTypes.length)];

      let exprText = "";

      if (chosenType === 'add') {
        const a = randomInt(12, 450);
        const b = randomInt(15, 450);
        correctAnswer = a + b;
        exprText = `${a} + ${b}`;
      } else if (chosenType === 'sub') {
        let a = randomInt(25, 600);
        let b = randomInt(10, 600);
        if (a < b) [a, b] = [b, a]; // Asegurar resultado positivo
        correctAnswer = a - b;
        exprText = `${a} - ${b}`;
      } else if (chosenType === 'mul') {
        const a = randomInt(11, 220); // 2 o 3 cifras
        const b = randomInt(2, 9);    // 1 cifra
        correctAnswer = a * b;
        exprText = `${a} × ${b}`;
      } else if (chosenType === 'div') {
        const divisor = randomInt(2, 9); // 1 cifra
        const quotient = randomInt(5, 25);
        const dividend = divisor * quotient; // 2 cifras exacto
        correctAnswer = quotient;
        exprText = `${dividend} ÷ ${divisor}`;
      }

      requiredLength = String(correctAnswer).length;
      document.getElementById('mathExp').innerText = exprText;

      // Renderizar los cuadraditos de la longitud exacta
      const boxesContainer = document.getElementById('digitBoxes');
      boxesContainer.innerHTML = '';
      for (let i = 0; i < requiredLength; i++) {
        const box = document.createElement('div');
        box.className = 'digit-box';
        box.id = `box-${i}`;
        boxesContainer.appendChild(box);
      }

      updateDisplay();
    }

    function updateDisplay() {
      for (let i = 0; i < requiredLength; i++) {
        const box = document.getElementById(`box-${i}`);
        if (!box) continue;
        box.innerText = enteredDigits[i] || '';
        box.classList.remove('active-cursor', 'error');

        // Resaltar la casilla actual donde va a escribirse el siguiente número
        if (i === enteredDigits.length && !isLocked) {
          box.classList.add('active-cursor');
        }
      }
    }

    function pressDigit(num) {
      if (isLocked) return;
      if (enteredDigits.length < requiredLength) {
        enteredDigits += num;
        playBeep(350 + (num * 30), 'sine', 0.1);
        updateDisplay();
      }
    }

    function deleteDigit() {
      if (isLocked) return;
      if (enteredDigits.length > 0) {
        enteredDigits = enteredDigits.slice(0, -1);
        playBeep(240, 'triangle', 0.1);
        updateDisplay();
      }
    }

    async function checkAnswer() {
      if (isLocked) return;
      if (enteredDigits.length === 0) return;

      const userVal = parseInt(enteredDigits, 10);

      if (userVal === correctAnswer) {
        // Correcto
        isLocked = true;
        document.getElementById('status').innerText = '¡TAREA COMPLETADA!';
        playBeep(650, 'sine', 0.15);
        setTimeout(() => playBeep(920, 'sine', 0.35), 130);
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

        await client.from('completed_tasks').insert([{ player_name: currentPlayer, task_name: TASK_ID }]);
        await releaseSession();
      } else {
        // Incorrecto
        isLocked = true;
        playBeep(160, 'sawtooth', 0.35);
        if (navigator.vibrate) navigator.vibrate(250);

        for (let i = 0; i < requiredLength; i++) {
          const box = document.getElementById(`box-${i}`);
          if (box) box.classList.add('error');
        }

        setTimeout(() => {
          generateMathProblem(); // Nueva operación tras el error
        }, 800);
      }
    }
  </script>
</body>
</html>
