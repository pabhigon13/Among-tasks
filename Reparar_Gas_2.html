<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Válvula de Gas Beta</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
    body {
      background: radial-gradient(circle at center, #1a080d 0%, #050102 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0.6rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .gas-cabinet {
      position: relative;
      background: linear-gradient(180deg, #240c12 0%, #130508 100%);
      border: 4px solid #7f1d1d;
      border-radius: 20px;
      width: 100%;
      max-width: 360px;
      padding: 1rem 0.9rem;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.9), 0 16px 36px rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .rivet {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: radial-gradient(circle, #fca5a5 20%, #450a0a 90%);
      box-shadow: 0 1px 2px #000;
    }
    .rivet.tl { top: 8px; left: 8px; }
    .rivet.tr { top: 8px; right: 8px; }
    .rivet.bl { bottom: 8px; left: 8px; }
    .rivet.br { bottom: 8px; right: 8px; }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.4rem 0.6rem;
      background: #0d0305;
      border: 2px solid #3f1118;
      border-radius: 10px;
    }
    .valve-tag {
      font-size: 0.75rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #f87171;
    }
    .countdown-chip {
      font-family: "Courier New", monospace;
      font-size: 1.15rem;
      font-weight: 900;
      padding: 2px 10px;
      border-radius: 6px;
      background: #2b0b12;
      border: 1px solid #ef4444;
      color: #ef4444;
    }
    .countdown-chip.safe {
      border-color: #22c55e;
      background: #052e16;
      color: #4ade80;
    }

    .module-display {
      background: #070103;
      border: 2px solid #450a0a;
      border-radius: 14px;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      box-shadow: inset 0 0 15px rgba(239, 68, 68, 0.15);
    }
    .display-row {
      display: flex;
      align-items: center;
      justify-content: space-around;
      gap: 0.6rem;
    }

    .gauge-wrapper {
      width: 76px;
      height: 76px;
      flex-shrink: 0;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,0.6));
    }
    .gauge-wrapper svg { width: 100%; height: 100%; }

    .postit-card {
      background: #fef08a;
      border: 1px solid #ca8a04;
      border-radius: 6px;
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
      transform: rotate(1.5deg);
    }
    .postit-label {
      font-size: 0.6rem;
      font-weight: 900;
      letter-spacing: 1px;
      color: #713f12;
    }
    .postit-num {
      font-family: "Courier New", monospace;
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 4px;
      color: #451a03;
    }

    .lcd-input {
      background: #000;
      border: 2px solid #7f1d1d;
      border-radius: 8px;
      padding: 0.4rem;
      font-family: "Courier New", monospace;
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 8px;
      color: #f87171;
      text-shadow: 0 0 8px #ef4444;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }
    .key-btn {
      height: 48px;
      background: linear-gradient(180deg, #2b0b12 0%, #180509 100%);
      border: 2px solid #5a1420;
      border-radius: 10px;
      color: #fecdd3;
      font-size: 1.35rem;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 0 #0f0305;
      transition: all 0.05s;
    }
    .key-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #0f0305;
      background: #47111c;
    }
    .key-btn.del { background: linear-gradient(180deg, #451a03 0%, #290e02 100%); border-color: #9a3412; color: #fdba74; }
    .key-btn.enter { background: linear-gradient(180deg, #14532d 0%, #052e16 100%); border-color: #22c55e; color: #86efac; }

    .footer-status {
      min-height: 38px;
      padding: 0.5rem 0.6rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 900;
      letter-spacing: 0.8px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #3f1118;
      background: #0a0204;
      color: #94a3b8;
    }
    .footer-status.wait {
      border-color: #eab308;
      color: #fde047;
      background: rgba(234, 179, 8, 0.12);
      animation: pulseGlow 1.2s infinite alternate;
    }
    .footer-status.done {
      border-color: #22c55e;
      color: #4ade80;
      background: rgba(34, 197, 94, 0.15);
    }
    .footer-status.error {
      border-color: #ef4444;
      color: #fca5a5;
      background: rgba(239, 68, 68, 0.18);
    }

    #overlay {
      position: fixed; inset: 0; background: #070103; z-index: 50;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem;
    }
    .overlay-input {
      padding: 0.8rem; border-radius: 8px; border: 1px solid #444; background: #1e2430;
      color: #fff; width: 80%; max-width: 250px; text-align: center; font-size: 1rem;
    }
    .overlay-btn {
      margin-top: 1rem; padding: 0.8rem 1.6rem; background: #ef4444; color: #fff;
      border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Overlay -->
  <div id="overlay">
    <h2 style="color: #ef4444; margin-bottom: 0.4rem;">VÁLVULA DE GAS B</h2>
    <p style="color: #94a3b8; font-size: 0.85rem; margin-bottom: 1.2rem;">Identifícate para purgar el conducto secundario</p>
    <input id="playerName" class="overlay-input" placeholder="Tu nombre..." autocomplete="off" />
    <button class="overlay-btn" onclick="startTerminal()">Entrar a la Consola</button>
  </div>

  <div class="gas-cabinet">
    <div class="rivet tl"></div><div class="rivet tr"></div>
    <div class="rivet bl"></div><div class="rivet br"></div>

    <div class="header-bar">
      <span class="valve-tag">VÁLVULA 2 (SECUNDARIA)</span>
      <span id="countdownChip" class="countdown-chip safe">OK</span>
    </div>

    <div class="module-display">
      <div class="display-row">
        <!-- Manómetro -->
        <div class="gauge-wrapper">
          <svg viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="44" fill="#0f0306" stroke="#450a0a" stroke-width="4"/>
            <path d="M 22 75 A 36 36 0 1 1 78 75" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
            <path d="M 60 20 A 36 36 0 0 1 78 75" fill="none" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
            <line id="gaugeNeedle" x1="50" y1="50" x2="50" y2="20" stroke="#f87171" stroke-width="3" stroke-linecap="round" transform="rotate(-60 50 50)"/>
            <circle cx="50" cy="50" r="6" fill="#f87171"/>
          </svg>
        </div>

        <!-- Post-it con el código autogenerado (salt 202 para ser distinto a la A) -->
        <div class="postit-card">
          <span class="postit-label">CLAVE DE PURGA</span>
          <span class="postit-num" id="postitCode">-----</span>
        </div>
      </div>

      <div class="lcd-input" id="lcdDisplay">_____</div>
    </div>

    <!-- Teclado Numérico -->
    <div class="keypad">
      <button class="key-btn" onclick="pressDigit(1)">1</button>
      <button class="key-btn" onclick="pressDigit(2)">2</button>
      <button class="key-btn" onclick="pressDigit(3)">3</button>

      <button class="key-btn" onclick="pressDigit(4)">4</button>
      <button class="key-btn" onclick="pressDigit(5)">5</button>
      <button class="key-btn" onclick="pressDigit(6)">6</button>

      <button class="key-btn" onclick="pressDigit(7)">7</button>
      <button class="key-btn" onclick="pressDigit(8)">8</button>
      <button class="key-btn" onclick="pressDigit(9)">9</button>

      <button class="key-btn del" onclick="deleteDigit()">⌫</button>
      <button class="key-btn" onclick="pressDigit(0)">0</button>
      <button class="key-btn enter" onclick="submitCode()">↵</button>
    </div>

    <div class="footer-status" id="footerStatus">SISTEMA EN REPOSO</div>
  </div>

  <script>
    const VALVE_ID = 'valvula_2';
    const OTHER_VALVE_ID = 'valvula_1';
    const TIMEOUT_LIMIT = 45;

    const SUPABASE_URL = 'https://yxgwdxlplvxvnhnsgkja.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4Z3dkeGxwbHZ4dm5obnNna2phIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNDMzMDUsImV4cCI6MjEwNzkxOTMwNX0.qol-pxboTuyShUCVCjs5_qa0FJg5W-TONZjlSopuciQ';
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentPlayer = '';
    let enteredCode = '';
    let currentCode = '00000';
    let isSabotageActive = false;
    let thisValvePurged = false;
    let otherValvePurged = false;
    let lastStartedAt = '';

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq = 440, type = 'sine', duration = 0.08) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    // Salt 202 para que el código sea completamente diferente al de la válvula A
    function deriveCodeFromTimestamp(timestampStr, salt = 202) {
      if (!timestampStr) return '54321';
      let hash = 0;
      const str = timestampStr + salt;
      for (let i = 0; i < str.length; i++) {
        hash = (hash << 5) - hash + str.charCodeAt(i);
        hash |= 0;
      }
      const positive = Math.abs(hash);
      const codeNum = (positive % 90000) + 10000;
      return codeNum.toString();
    }

    function startTerminal() {
      const input = document.getElementById('playerName');
      const name = input.value.trim().toUpperCase();
      if (!name) return alert('Escribe tu nombre');
      currentPlayer = name;
      document.getElementById('overlay').style.display = 'none';

      pollStatus();
      setInterval(pollStatus, 1500);
    }

    async function pollStatus() {
      const { data: sab } = await client.from('sabotages').select('*').eq('id', 'fuga').maybeSingle();
      const chip = document.getElementById('countdownChip');
      const needle = document.getElementById('gaugeNeedle');
      const footer = document.getElementById('footerStatus');

      if (!sab || !sab.active) {
        isSabotageActive = false;
        thisValvePurged = false;
        otherValvePurged = false;
        chip.className = 'countdown-chip safe';
        chip.innerText = 'OK';
        needle.setAttribute('transform', 'rotate(-60 50 50)');
        document.getElementById('postitCode').innerText = '-----';
        footer.className = 'footer-status';
        footer.innerText = 'SISTEMA SEGURO - SIN FUGAS';
        return;
      }

      isSabotageActive = true;
      needle.setAttribute('transform', 'rotate(60 50 50)');

      if (sab.started_at !== lastStartedAt) {
        lastStartedAt = sab.started_at;
        currentCode = deriveCodeFromTimestamp(sab.started_at, 202);
        document.getElementById('postitCode').innerText = currentCode;
        enteredCode = '';
        updateDisplay();
      }

      const elapsed = Math.floor((Date.now() - new Date(sab.started_at).getTime()) / 1000);
      const remaining = Math.max(0, TIMEOUT_LIMIT - elapsed);
      chip.className = 'countdown-chip';
      chip.innerText = `${remaining}s`;

      if (remaining === 0) {
        footer.className = 'footer-status error';
        footer.innerText = '☠️ INTOXICACIÓN TOTAL - DERROTA';
        return;
      }

      const { data: vList } = await client.from('gas_valves').select('*');
      if (vList) {
        const vThis = vList.find(v => v.id === VALVE_ID);
        const vOther = vList.find(v => v.id === OTHER_VALVE_ID);

        thisValvePurged = vThis ? vThis.purged : false;
        otherValvePurged = vOther ? vOther.purged : false;
      }

      if (thisValvePurged && otherValvePurged) {
        footer.className = 'footer-status done';
        footer.innerText = '✅ VÁLVULA SELLADA - FUGA CONTROLADA';
      } else if (thisValvePurged && !otherValvePurged) {
        footer.className = 'footer-status wait';
        footer.innerText = '⏳ ESPERANDO A QUE SE SELLE LA OTRA VÁLVULA...';
      } else if (!thisValvePurged && otherValvePurged) {
        footer.className = 'footer-status wait';
        footer.innerText = '⚠️ LA OTRA VÁLVULA YA ESTÁ PURGADA. ¡METE EL CÓDIGO!';
      } else {
        footer.className = 'footer-status error';
        footer.innerText = '⚠️ FUGA EN CURSO - INTRODUCE EL CÓDIGO';
      }
    }

    function pressDigit(num) {
      if (!isSabotageActive || thisValvePurged) return;
      if (enteredCode.length < 5) {
        enteredCode += num;
        playBeep(320 + (num * 35), 'sine', 0.08);
        updateDisplay();
      }
    }

    function deleteDigit() {
      if (!isSabotageActive || thisValvePurged) return;
      if (enteredCode.length > 0) {
        enteredCode = enteredCode.slice(0, -1);
        playBeep(220, 'triangle', 0.08);
        updateDisplay();
      }
    }

    function updateDisplay() {
      const display = document.getElementById('lcdDisplay');
      let str = enteredCode;
      while (str.length < 5) str += '_';
      display.innerText = str;
    }

    async function submitCode() {
      if (!isSabotageActive || thisValvePurged) return;

      const footer = document.getElementById('footerStatus');

      if (enteredCode === currentCode) {
        playBeep(880, 'sine', 0.35);
        if (navigator.vibrate) navigator.vibrate(100);

        thisValvePurged = true;

        await client.from('gas_valves').upsert({
          id: VALVE_ID,
          purged: true,
          purged_by: currentPlayer,
          purged_at: new Date().toISOString()
        });

        const { data: otherV } = await client.from('gas_valves').select('*').eq('id', OTHER_VALVE_ID).maybeSingle();

        if (otherV && otherV.purged) {
          await client.from('sabotages').upsert({ id: 'fuga', active: false, fixed_by: `${otherV.purged_by} & ${currentPlayer}` });
          await client.from('gas_valves').update({ purged: false }).neq('id', '');
          footer.className = 'footer-status done';
          footer.innerText = '✅ VÁLVULA SELLADA - FUGA CONTROLADA';
        } else {
          footer.className = 'footer-status wait';
          footer.innerText = '⏳ ESPERANDO A QUE SE SELLE LA OTRA VÁLVULA...';
        }
      } else {
        playBeep(160, 'sawtooth', 0.3);
        if (navigator.vibrate) navigator.vibrate(250);
        footer.className = 'footer-status error';
        footer.innerText = '❌ CÓDIGO INCORRECTO';
        enteredCode = '';
        updateDisplay();
      }
    }
  </script>
</body>
</html>
